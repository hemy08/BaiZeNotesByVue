appId: hemye.BaiZeNotes
productName: BaiZeNotes
# ARC-20：显式声明 asar 打包策略，避免依赖 electron-builder 未来默认值变化
asar: true
# 2026-11-18（遗留清单 #14）：显式声明压缩策略（默认 normal；maximum 进一步压缩安装包，
# 首次解压稍慢但体积更小；如需更快安装可改为 normal/store）
compression: maximum
# P3-4（2026-11-20 安全剩余项 · Fuses 余项评估）：Electron Fuses 加固（electron-builder 26 的
# electronFuses 直接透传 @electron/fuses；在 afterPack 阶段、签名前翻转打包产物中的 fuse 位）。
# 发布矩阵 8 项全量显式声明：与 build/electron-fuses-matrix.js 的 RELEASE_FUSE_MATRIX 一致，
# 由 build/verify-packaged-fuses.js 在构建后读取 exe 实际 fuse 位逐项断言（防「配置未生效」）。
# 逐项理由（评估证据见 out/tool-results/fix-fuses2.md）：
# - runAsNode: false——禁止 ELECTRON_RUN_AS_NODE 把应用二进制当 Node 运行
#   （本地攻击者/恶意快捷方式无法借此执行任意 JS；应用运行期无 process.fork 依赖）；
# - enableCookieEncryption: false——应用不使用 Cookie（无登录态），保持默认；
# - enableNodeOptionsEnvironmentVariable: false——不读取 NODE_OPTIONS/NODE_EXTRA_CA_CERTS，
#   阻断「环境变量注入 Node 参数」滥用链；代价：企业自定义 CA 场景需改用系统证书库；
# - enableNodeCliInspectArguments: false——禁用 --inspect/--inspect-brk/SIGUSR1 主进程调试入口。
#   注意：Playwright `_electron.launch` 固定用 `--inspect=0` 连接主进程，因此打包 E2E 改用
#   `npm run build:unpack:e2e`：先按本发布矩阵构建并验证，再由 build/e2e-enable-inspect.js
#   仅放开该位（必须显式 ELECTRON_BUILDER_E2E=1，产物仅供测试）。发布配置不保留 E2E 例外；
# - enableEmbeddedAsarIntegrityValidation: true——校验 app.asar 完整性（Electron Windows
#   支持见 >=30，本项目 43.8.12；electron-builder 会写入 PE 资源 INTEGRITY/ELECTRONASAR）；
# - onlyLoadAppFromAsar: true——只从 resources/app.asar 加载应用代码，跳过 app/ 与
#   default_app.asar 回退，阻止旁加载未校验代码；
# - loadBrowserProcessSpecificV8Snapshot: false——无自定义 V8 快照需求，保持默认；
# - grantFileProtocolExtraPrivileges: false（2026-11-20 已关闭）——renderer 已从 file://
#   迁移到 app:// 自定义标准安全协议（src/main/protocol/app-protocol.ts）：主窗口/PlantUML
#   隐藏窗口经 app:// 加载 asar 内 renderer 与 extraResources，用户本地文件走受 Path Guard
#   白名单校验的 app://local。关闭后同时消除 file:// 页面的 fetch/ServiceWorker/子帧越权面
#   （评估与迁移证据见 out/tool-results/fix-app-protocol.md）。
electronFuses:
    runAsNode: false
    enableCookieEncryption: false
    enableNodeOptionsEnvironmentVariable: false
    enableNodeCliInspectArguments: false
    enableEmbeddedAsarIntegrityValidation: true
    onlyLoadAppFromAsar: true
    loadBrowserProcessSpecificV8Snapshot: false
    grantFileProtocolExtraPrivileges: false
# P0 安装包瘦身（2026-11-19）：Electron 运行时自带 55 个 locale 语言包
# （win-unpacked/locales/*.pak，实测合计约 46.6 MiB），NSIS/portable 打包时全部随包分发。
# 应用 UI 词典只有 zh-CN / en-US 两套（src/shared/i18n/messages），其余 53 种语言
# 运行时不可达，属死重。按 electron-builder 官方 electronLanguages 配置裁剪；
# 构建后由 build/check-bundle-budget.js 断言 locales 目录仅保留这 2 个 .pak。
electronLanguages:
    - zh-CN
    - en-US
directories:
    buildResources: build
    # M7 产物治理（第 5 批）：安装包/解包目录统一收敛到 out/build/dist（默认 dist/ 已废弃）。
    # 与 electron.vite.config.ts 的 outDir、.github/workflows/release.yml 的产物校验路径保持一致。
    output: out/build/dist
files:
    # CMP-25：白名单化打包产物，避免 out/**/* 把 out/tool-results 等临时分析产物
    # （约 24MB）误打入 app.asar，并消除打包期并发写文件导致的构建不稳定
    # M7：electron-vite 产物已迁至 out/build/{main,preload,renderer}（见 electron.vite.config.ts）
    - out/build/main/**/*
    - out/build/preload/**/*
    - out/build/renderer/**/*
    # ARC-20：electron-vite 6 产物为 out/build/main、out/build/preload、out/build/renderer，
    # 不存在旧构建布局的 out/renderer/src 目录，空操作的排除项已移除
    # ET-3：排除 source map（运行时不需要；基线打包前 node_modules 内 *.map 约 100MB）
    - '!**/*.map'
    # P2-4（2026-11-20 性能扫描：asar 内运行期无用文件裁剪）：jschardet 的 dist/（实测
    # 4.66 MiB，含 esm/umd/min 等多份浏览器构建）仅服务 package.json 的 `browser` 条件与
    # jsdelivr/unpkg 字段；主进程 `require('jschardet')` 按 exports 的 require 条件解析到
    # `build/index.cjs`（Node 端入口），build/ 内无任何 ../dist 引用，渲染层也不 import
    # jschardet。因此 dist/ 运行期不可达，精确排除；build/（编码探测实现）完整保留。
    - '!**/node_modules/jschardet/dist/**'
    # ===== 1.5.2 E3 图片 OCR：tesseract.js / tesseract.js-core 体积裁剪（PERF-01/PERF-02） =====
    # 背景：tesseract.js-core 的 12 个 wasm/wasm.js 变体合计 43.17 MiB，远超 asar 预算。
    # 本项目 OCR worker 通过自建 adapter **固定加载 baseline LSTM 变体**
    # （tesseract.js v7 Node 端 getCore 按 CPU 特性在多变体间选择且忽略 corePath，
    #  体积预算只允许保留 1 个变体 → 由 utils/ocr/ocr-tesseract-runtime.ts 接管 core 加载）。
    # 保留：tesseract-core-lstm.js（约 87 KiB glue）+ tesseract-core-lstm.wasm（约 2.72 MiB）。
    # 排除：其余 5 个变体（含 relaxedSimd/simd 的 LSTM 与非 LSTM 版）与全部 *.wasm.js
    # （内联 base64 版本，Node 端 glue 直接读取同名 .wasm 文件，不会加载 .wasm.js）：
    - '!**/node_modules/tesseract.js-core/tesseract-core.js'
    - '!**/node_modules/tesseract.js-core/tesseract-core.wasm'
    - '!**/node_modules/tesseract.js-core/tesseract-core.wasm.js'
    - '!**/node_modules/tesseract.js-core/tesseract-core-lstm.wasm.js'
    - '!**/node_modules/tesseract.js-core/tesseract-core-simd.js'
    - '!**/node_modules/tesseract.js-core/tesseract-core-simd.wasm'
    - '!**/node_modules/tesseract.js-core/tesseract-core-simd.wasm.js'
    - '!**/node_modules/tesseract.js-core/tesseract-core-simd-lstm.js'
    - '!**/node_modules/tesseract.js-core/tesseract-core-simd-lstm.wasm'
    - '!**/node_modules/tesseract.js-core/tesseract-core-simd-lstm.wasm.js'
    - '!**/node_modules/tesseract.js-core/tesseract-core-relaxedsimd.js'
    - '!**/node_modules/tesseract.js-core/tesseract-core-relaxedsimd.wasm'
    - '!**/node_modules/tesseract.js-core/tesseract-core-relaxedsimd.wasm.js'
    - '!**/node_modules/tesseract.js-core/tesseract-core-relaxedsimd-lstm.js'
    - '!**/node_modules/tesseract.js-core/tesseract-core-relaxedsimd-lstm.wasm'
    - '!**/node_modules/tesseract.js-core/tesseract-core-relaxedsimd-lstm.wasm.js'
    # 根入口 index.js require 非 LSTM 变体，本项目按子路径强制加载单变体，根入口运行期不可达
    - '!**/node_modules/tesseract.js-core/index.js'
    # tesseract.js 本体：Node 只 require src/（worker-script + 常量/工具）；dist（浏览器构建 876 KiB）、
    # docs（403 KiB）、examples/scripts、karma 配置与 README 运行期均不可达（同 jschardet dist 口径）
    - '!**/node_modules/tesseract.js/dist/**'
    - '!**/node_modules/tesseract.js/docs/**'
    - '!**/node_modules/tesseract.js/examples/**'
    - '!**/node_modules/tesseract.js/scripts/**'
    - '!**/node_modules/tesseract.js/karma.conf.js'
    - '!**/node_modules/tesseract.js/README.md'
    # tesseract.js 生产依赖树裁剪（逐条理由，均为本项目 OCR 路径运行期不可达）：
    # - zlibjs：仅 worker-script/browser/gunzip.js（浏览器端）使用；Node 端用 node:zlib（裁 3.56 MiB）
    # - idb-keyval：仅浏览器端缓存；Node 端缓存走 fs
    # - node-fetch：tesseract.js 按 `global.fetch || require('node-fetch')` 回退；Electron 43（Node 22）
    #   自带 global.fetch，运行期不会 require
    # - wasm-feature-detect：仅 tesseract.js 默认 getCore 的 SIMD 探测使用；本项目固定单变体不走该分支
    # - opencollective-postinstall：npm 安装期脚本依赖，运行期无 require
    - '!**/node_modules/zlibjs/**'
    - '!**/node_modules/idb-keyval/**'
    - '!**/node_modules/node-fetch/**'
    - '!**/node_modules/wasm-feature-detect/**'
    - '!**/node_modules/opencollective-postinstall/**'
    # bmp-js：setImage 在模块加载期 require（保留包本体），仅排除其测试图片（约 0.6 MiB）
    - '!**/node_modules/bmp-js/test/**'
    # ===== 1.5.2 E3 附带：主进程生产依赖「运行期不可达死重」回收 =====
    # 背景：OCR（tesseract.js-core baseline LSTM ~2.8 MiB）使 portable 逼近 101 MiB 预算上限，
    # 按 PERF-01/PERF-02 不得放宽阈值，改为回收既有依赖中运行期不可达的文件（每条均注明依据，
    # 并由 `out/tmp` 一次性 Electron asar 功能冒烟验证 Word/编码/JSON 链路仍可用）：
    # - @mixmark-io/domino/.yarn：npm 包内遗留的 yarn 插件（1.0 MiB），turndown 只 require 包入口 lib/；
    - '!**/node_modules/@mixmark-io/domino/.yarn/**'
    # - mammoth 浏览器构建：Node 端 require 解析 package.json#main = lib/index.js；
    #   mammoth.browser*.js 仅供浏览器打包器（package.json#browser 字段）使用；
    - '!**/node_modules/mammoth/mammoth.browser.js'
    - '!**/node_modules/mammoth/mammoth.browser.min.js'
    - '!**/node_modules/mammoth/NEWS'
    # - lodash：officegen 只 require 包入口 lodash.js；fp / core / min 变体运行期不可达；
    - '!**/node_modules/lodash/fp/**'
    - '!**/node_modules/lodash/fp.js'
    - '!**/node_modules/lodash/core.js'
    - '!**/node_modules/lodash/core.min.js'
    - '!**/node_modules/lodash/lodash.min.js'
    # - officegen：入口 index.js + lib/ 为唯一运行链，logos/（文档配图）、manual/（手册）、
    #   内置 xmlbuilder 的 perf/（性能基准脚本）均无 require 引用；
    - '!**/node_modules/officegen/logos/**'
    - '!**/node_modules/officegen/manual/**'
    - '!**/node_modules/officegen/node_modules/xmlbuilder/perf/**'
    # - jszip：仅 lib/（package.json#main）运行期可达；jekyll 站点元数据/依赖图 SVG/变更日志/许可文本
    #   均非运行期文件（README/CHANGELOG 类同 jschardet dist 裁剪口径）；
    - '!**/node_modules/jszip/.jekyll-metadata'
    - '!**/node_modules/jszip/graph.svg'
    - '!**/node_modules/jszip/CHANGES.md'
    - '!**/node_modules/jszip/LICENSE.markdown'
    - '!**/node_modules/jszip/tsconfig.json'
    # - pako：jszip/lib/flate.js 只 require 包入口（index.js → lib/），dist/ 为浏览器 UMD 构建；
    - '!**/node_modules/pako/dist/**'
    # - ajv：conf/electron-store 经包入口 dist/ajv.js（自包含构建）消费，lib/ 为同功能 TS 源构建；
    - '!**/node_modules/ajv/lib/**'
    # —— 第二批（同为运行期不可达产物；由 out/tmp 一次性 Electron asar 功能冒烟逐包验证）——
    # jszip：main=./lib/index；dist/（jszip.js/jszip.min.js 浏览器 UMD，约 450 KiB）不参与 Node 解析；
    - '!**/node_modules/jszip/dist/**'
    # turndown：main=lib/turndown.cjs.js；dist/ 为浏览器构建；
    - '!**/node_modules/turndown/dist/**'
    # js-yaml：main=index.js → lib/；dist/ 为浏览器构建（electron-updater/conf 均走 CJS 入口）；
    - '!**/node_modules/js-yaml/dist/**'
    # async：main=dist/async.js（自包含，无 require）；顶层按方法拆分的 *.js 与 internal/ 仅供
    # `require('async/<method>')` 消费（本项目依赖链 archiver → require('async') 只走主入口），
    # dist/async.mjs 为 ESM 变体、async.min.js 为压缩版；
    - '!**/node_modules/async/[a-z]*.js'
    - '!**/node_modules/async/internal/**'
    - '!**/node_modules/async/dist/async.mjs'
    - '!**/node_modules/async/dist/async.min.js'
    # markdown-it：main=dist/markdown-it.cjs.js；browser/ 与 .mjs/.d.* 为其他产物；
    - '!**/node_modules/markdown-it/browser/**'
    - '!**/node_modules/markdown-it/dist/markdown-it.mjs'
    - '!**/node_modules/markdown-it/dist/markdown-it.d.mts'
    - '!**/node_modules/markdown-it/dist/markdown-it.d.cts'
    # node-fetch 已被排除（tesseract.js Node 端走 global.fetch），其独占依赖
    # whatwg-url / tr46 / webidl-conversions 不会被任何运行时代码 require（jsdom 属 devDependencies 不进包）；
    - '!**/node_modules/whatwg-url/**'
    - '!**/node_modules/tr46/**'
    - '!**/node_modules/webidl-conversions/**'
    # mammoth：lib/ 不 require argparse（仅 bin/ CLI 使用），排除嵌套 argparse 与 CLI 入口；
    - '!**/node_modules/mammoth/node_modules/argparse/**'
    - '!**/node_modules/mammoth/bin/**'
    # officegen：test_files/（测试夹具）、CHANGELOG、根目录 logo*.png 均无 require 引用；
    - '!**/node_modules/officegen/test_files/**'
    - '!**/node_modules/officegen/CHANGELOG'
    - '!**/node_modules/officegen/logo*.png'
    # tesseract.js：浏览器 worker 目录不参与本项目 Node worker 链路（主进程只 require worker-script 子集）；
    - '!**/node_modules/tesseract.js/src/worker/**'
    - '!**/node_modules/tesseract.js/src/worker-script/browser/**'
    # lodash：唯一消费方 officegen 只 require 包入口 lodash.js（全仓生产依赖闭包内
    # `lodash/<子路径>` 引用实测 0 处），按方法拆分与私有 helper 文件运行期不可达；
    - '!**/node_modules/lodash/[a-k]*.js'
    - '!**/node_modules/lodash/[m-z]*.js'
    - '!**/node_modules/lodash/_*.js'
    - '!**/.vscode/*'
    - '!src/*'
    - '!electron.vite.config.{js,ts,mjs,cjs}'
    - '!{.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
    - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
    - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
    # 运行时配置文件（主进程经 getAppResourcesPath()/config/version.json 读取，见 src/main/utils/utils.ts）
    # P2-4（2026-11-20：resources 死重裁剪）：只打包运行必需的两份配置——
    # naviConfig.json 与构建脚本 build/generate-version-config.js 生成的 version.json；
    # update.config.md（update.json 字段说明文档）、update.json.example（示例）不随包分发。
    # 说明：update.json 本身是用户按需在安装目录自建的运行时覆盖文件（默认不存在，缺失时
    # 回退 electron-builder 的 app-update.yml），两文档仅面向部署者，运行期代码不读取。
    - from: 'resources/config'
      to: 'config'
      filter: ['naviConfig.json', 'version.json']
    # 应用图标（安装器与运行时引用，保留）
    # 1.5.2 E3：仅打包运行期真实引用的两枚图标——主窗口用 512、托盘用 256
    # （src/main/index.ts MAIN_WINDOW_ICON_FILE_NAME / utils/tray.ts TRAY_ICON_FILE_NAME）；
    # baize_clear_icon.ico 全仓无运行期引用（历史清理遗留资产），不再随包分发（节省约 0.09 MiB）。
    # 安装器图标在 electron-builder#win/n sis 段单独引用，不依赖本 extraResources 条目。
    - from: 'resources/icon'
      to: 'icon'
      filter: ['baize_mirror_dark_256x256.ico', 'baize_mirror_dark_512x512.ico']
    # Monaco 编辑器主题（monaco-themes/themes 55 个，theme-registry 动态扫描，保留）
    # 应用主题（原 resources/themes/app_themes 下 24 个 json）为死资产，已随 2026-11-15 死资产清理删除；
    # 应用主题真源是 src/main/config/theme-config.ts 的 28 套（编译进主进程产物），无需打包资源文件。
    - from: 'resources/themes/monaco-themes'
      to: 'themes/monaco-themes'
      filter: ['**/*']
    # PlantUML Web 资源（src/main/utils/app-paths.ts getPlantumlPath 仍引用，目录实测存在，保留）
    - from: 'resources/plantuml'
      to: 'plantuml'
      filter: ['**/*']
    # 帮助 → 使用指导 PDF（主进程固定路径经 getAppResourcesPath()/help/usage-guide.pdf 打开）
    - from: 'resources/help'
      to: 'help'
      filter: ['**/*']
    # ARC-20 说明：resources/katex、resources/mermaid 目录实测不存在，对应条目已删除；
    # KaTeX/Mermaid 均从 node_modules 导入（KatexRender.ts 与渲染层入口），无需作为 extraResources 打包
fileAssociations:
    # D2：Windows 安装包注册 Markdown/文本文件关联；双击文件时经单实例链路打开。
    - ext: [md, markdown]
      name: Markdown Document
      description: Markdown note
      role: Editor
    - ext: [txt]
      name: Text Document
      description: Plain text note
      role: Editor
win:
    executableName: BaiZeNotes
    icon: resources/icon/baize_mirror_dark_256x256.ico
    target:
        - target: nsis
          arch:
              - x64
        - target: portable
          arch:
              - x64
nsis:
    artifactName: ${productName}_Setup_${version}_windows_${arch}.${ext}
    shortcutName: ${productName}
    uninstallDisplayName: ${productName}
    createDesktopShortcut: always
    oneClick: false
    allowToChangeInstallationDirectory: true
    allowElevation: true
    installerIcon: resources/icon/baize_mirror_dark_256x256.ico
    uninstallerIcon: resources/icon/baize_mirror_dark_256x256.ico
    installerHeaderIcon: resources/icon/baize_mirror_dark_256x256.ico
    deleteAppDataOnUninstall: false
    runAfterFinish: true
    include: build/uninstaller.nsh
portable:
    artifactName: ${productName}_${version}_windows_${arch}.${ext}
mac:
    # TODO(ET-16)：build/entitlements.mac.plist 当前不存在，mac 目标打包会因缺少该文件失败。
    # 项目目前只发布 Windows 产物（win 目标），mac/linux 段保留为后续扩展占位；
    # 启用 mac 构建前需补：entitlements + entitlementsInherit 文件、开发者签名
    # （CSC_LINK/CSC_KEY_PASSWORD）与公证（notarize，当前 false）。
    entitlementsInherit: build/entitlements.mac.plist
    extendInfo:
        - NSCameraUsageDescription: Application requests access to the device's camera.
        - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
        - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
        - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    notarize: false
dmg:
    artifactName: ${productName}_Setup_${version}_MacOS_${arch}.${ext}
linux:
    target:
        - AppImage
        - snap
        - deb
    # TODO(ET-16)：占位值，发布 Linux 包前改为真实维护者邮箱（electron-builder 的 maintainer 字段）。
    maintainer: electronjs.org
    category: Utility
appImage:
    artifactName: ${productName}_Setup_${version}_Linux_${arch}.${ext}
npmRebuild: false
# FUN-10/CMP-21：发布源配置（构建时生成 app-update.yml 供 electron-updater 使用）
# TODO(ET-16)：example.com 为占位地址，当前"检查更新"会提示"未配置更新源"（见
# src/main/utils/auto-updater.ts 的占位检测逻辑）。
# 部署真实更新服务器后，请将 url 替换为真实地址：
#   - GitHub Releases 发布场景可直接换用 provider: github，或
#   - 自建 generic 静态文件服务器，url 指向存放 latest.yml 的目录。
# 替换后重新打包，发布产物即携带可用的更新源。
# 注：本项目当前无代码签名配置（Windows 签名需 CSC_LINK 证书或自建签名链），
# 发布前需单独接入，否则 SmartScreen 会提示未知发布者。
publish:
    provider: generic
    # 2026-11-18（遗留清单 #8）：默认更新源指向本仓库 GitHub Releases 的静态下载目录。
    # 发布时执行 `build:win:all` 后将 latest.yml 与安装包作为 Release 资产上传，
    # electron-updater 即可通过 releases/latest/download/ 访问（generic provider 直链）。
    # 如需自建服务器，可在 resources/config/update.json 中覆盖此默认值（无需重新打包）。
    url: https://github.com/hemy08/BaiZeNotesByVue/releases/latest/download
electronDownload:
    mirror: https://npmmirror.com/mirrors/electron/
