# Prettier 配置（ET-12）
# 与 .editorconfig 对齐：仓库源码统一 4 空格缩进；行宽 100、无分号、单引号保持既有风格。
tabWidth: 4
useTabs: false
singleQuote: true
semi: false
printWidth: 100
trailingComma: none
# 结构优化第 5 批 5.2（L2）：行尾统一 LF，与 .editorconfig end_of_line 及 .gitattributes eol=lf 三者一致。
# 原为 auto（历史文件 CRLF/LF 混杂）；统一后 prettier --check 在全新检出（含 CI）同样稳定通过。
endOfLine: lf
