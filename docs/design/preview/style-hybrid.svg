<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif">
  <defs>
    <filter id="h1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#3a3428" flood-opacity="0.08"/>
    </filter>
    <filter id="h2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#10141a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- 外壳：工作台浅灰 -->
  <rect width="1280" height="800" fill="#f1f3f5"/>

  <!-- 顶栏：工作台紧凑 36 高 -->
  <rect x="0" y="0" width="1280" height="36" fill="#ffffff"/>
  <line x1="0" y1="36" x2="1280" y2="36" stroke="#cfd5dc"/>
  <circle cx="22" cy="18" r="6" fill="#764ba2"/>
  <text x="36" y="23" font-size="12" font-weight="600" fill="#16181d">白泽笔记</text>
  <g font-size="12" fill="#16181d">
    <text x="140" y="23">文件</text><text x="176" y="23">编辑</text><text x="212" y="23">视图</text>
    <text x="248" y="23">插入</text><text x="284" y="23">设置</text><text x="320" y="23">工具</text>
    <text x="356" y="23">插件</text><text x="392" y="23">帮助</text>
  </g>
  <rect x="984" y="8" width="196" height="20" rx="3" fill="#f4f6f8" stroke="#d9dde3"/>
  <text x="996" y="22" font-size="11" fill="#8a919c">搜索或输入命令</text>
  <rect x="1190" y="8" width="66" height="20" rx="2" fill="#f4f6f8" stroke="#d9dde3"/>
  <text x="1223" y="22" font-size="10" fill="#5b6470" text-anchor="middle">⌘K</text>

  <!-- 左栏：工作台文件树 -->
  <rect x="0" y="36" width="228" height="740" fill="#f7f8fa"/>
  <line x1="228" y1="36" x2="228" y2="776" stroke="#d9dde3"/>
  <text x="14" y="62" font-size="11" font-weight="600" fill="#8a919c">笔记</text>
  <rect x="8" y="72" width="212" height="22" rx="2" fill="#ede7f5"/>
  <rect x="8" y="72" width="2" height="22" fill="#764ba2"/>
  <text x="18" y="87" font-size="12" fill="#4a2f66">视觉升级方案</text>
  <g font-size="12" fill="#16181d">
    <text x="18" y="111">1.5.2 版本计划</text>
    <text x="18" y="135">代码结构优化计划</text>
    <text x="18" y="159">产品体验优化方案</text>
    <text x="18" y="183">开发规范</text>
    <text x="18" y="207">架构文档</text>
  </g>

  <!-- 编辑内容区：纸感底（暖白） -->
  <rect x="228" y="36" width="1052" height="740" fill="#f7f5f0"/>

  <!-- 正文：一张"纸"（纸感排版） -->
  <rect x="256" y="60" width="744" height="648" rx="4" fill="#fffdf8" stroke="#e8e3d8" filter="url(#h1)"/>
  <text x="292" y="118" font-size="22" font-weight="600" fill="#2b2620">BaiZe Notes · 视觉升级</text>
  <g font-size="16" fill="#2b2620">
    <text x="292" y="158">混合：纸感正文 + 工作台工具区，各取所长。</text>
    <text x="292" y="184">内容区是一张纸，外壳是清晰紧凑的工作台。</text>
  </g>
  <rect x="292" y="206" width="3" height="52" fill="#c9b6e4"/>
  <g font-size="13" fill="#7a7166">
    <text x="308" y="222">正文行高 1.75、暖白纸面、引用条只用 3px 强调色 30%。</text>
    <text x="308" y="244">工具区不回退到纸感：保持 24/28 行高与分区线。</text>
  </g>
  <g font-size="14" fill="#2b2620">
    <text x="292" y="292">• 正文用 paper 的排版与材质</text>
    <text x="292" y="316">• 顶栏/左栏/工具窗/表格/状态栏用 workbench 密度</text>
    <text x="292" y="340">• 两种材质在内容区边界自然分界</text>
  </g>
  <rect x="292" y="362" width="440" height="62" rx="6" fill="#f2efe8" stroke="#e8e3d8"/>
  <g font-size="11" fill="#7a7166" font-family="Consolas, monospace">
    <text x="306" y="384">style = 'hybrid'</text>
    <text x="306" y="402">// 正文=paper · 外壳/工具区=workbench</text>
  </g>
  <rect x="292" y="446" width="440" height="120" rx="6" fill="#fffdf8" stroke="#e8e3d8"/>
  <line x1="292" y1="478" x2="732" y2="478" stroke="#e8e3d8"/>
  <line x1="292" y1="510" x2="732" y2="510" stroke="#f0eae0"/>
  <line x1="292" y1="542" x2="732" y2="542" stroke="#f0eae0"/>
  <g font-size="11" fill="#7a7166">
    <text x="304" y="466">区域</text><text x="432" y="466">采用风格</text><text x="592" y="466">说明</text>
  </g>
  <g font-size="11" fill="#2b2620">
    <text x="304" y="498">正文/预览</text><text x="432" y="498">paper 纸感</text><text x="592" y="498">纸面 + 16/26 排版</text>
    <text x="304" y="530">菜单/左栏</text><text x="432" y="530">workbench</text><text x="592" y="530">36 高 + 分区线</text>
    <text x="304" y="562">工具窗/表格</text><text x="432" y="562">workbench</text><text x="592" y="562">紧凑行高 24/28</text>
  </g>

  <!-- 工具窗：工作台样式（悬浮在纸面上） -->
  <rect x="820" y="120" width="400" height="392" rx="6" fill="#ffffff" stroke="#d9dde3" filter="url(#h2)"/>
  <rect x="820" y="120" width="400" height="36" rx="6" fill="#f4f6f8"/>
  <line x1="820" y1="156" x2="1220" y2="156" stroke="#d9dde3"/>
  <g fill="#8a919c"><circle cx="836" cy="138" r="2"/><circle cx="843" cy="138" r="2"/><circle cx="850" cy="138" r="2"/><circle cx="836" cy="144" r="2"/><circle cx="843" cy="144" r="2"/><circle cx="850" cy="144" r="2"/></g>
  <text x="864" y="143" font-size="12" font-weight="600" fill="#16181d">Mermaid 工具窗</text>
  <circle cx="1180" cy="138" r="10" fill="#e8ecf0"/>
  <text x="1180" y="142" font-size="11" fill="#5b6470" text-anchor="middle">–</text>
  <circle cx="1204" cy="138" r="10" fill="#e8ecf0"/>
  <text x="1204" y="142" font-size="11" fill="#5b6470" text-anchor="middle">×</text>

  <rect x="836" y="172" width="368" height="212" rx="4" fill="#ffffff" stroke="#d9dde3"/>
  <rect x="836" y="172" width="368" height="24" rx="4" fill="#f4f6f8"/>
  <line x1="836" y1="196" x2="1204" y2="196" stroke="#d9dde3"/>
  <line x1="836" y1="220" x2="1204" y2="220" stroke="#e8ecf0"/>
  <line x1="836" y1="244" x2="1204" y2="244" stroke="#e8ecf0"/>
  <line x1="836" y1="268" x2="1204" y2="268" stroke="#e8ecf0"/>
  <line x1="940" y1="172" x2="940" y2="384" stroke="#e8ecf0"/>
  <line x1="1070" y1="172" x2="1070" y2="384" stroke="#e8ecf0"/>
  <g font-size="11" fill="#8a919c">
    <text x="848" y="189">标题</text><text x="952" y="189">状态</text><text x="1082" y="189">更新</text>
  </g>
  <g font-size="11" fill="#16181d">
    <text x="848" y="213">纸感正文</text><text x="952" y="213">已就绪</text><text x="1082" y="213">11-27</text>
    <text x="848" y="237">轻玻璃悬浮层</text><text x="952" y="237">实验</text><text x="1082" y="237">11-27</text>
    <text x="848" y="261">工作台密度</text><text x="952" y="261">已就绪</text><text x="1082" y="261">11-27</text>
    <text x="848" y="285">混合 hybrid</text><text x="952" y="285">新</text><text x="1082" y="285">11-27</text>
  </g>
  <rect x="1060" y="352" width="64" height="26" rx="2" fill="#764ba2"/>
  <text x="1092" y="369" font-size="11" fill="#ffffff" text-anchor="middle">插入</text>
  <rect x="1132" y="352" width="64" height="26" rx="2" fill="#f4f6f8" stroke="#d9dde3"/>
  <text x="1164" y="369" font-size="11" fill="#3d4250" text-anchor="middle">取消</text>

  <!-- 状态栏：工作台 -->
  <rect x="0" y="776" width="1280" height="24" fill="#ffffff"/>
  <line x1="0" y1="776" x2="1280" y2="776" stroke="#cfd5dc"/>
  <text x="12" y="792" font-size="11" fill="#8a919c">已保存 · UTF-8 · 1,234 字</text>
  <text x="1268" y="792" font-size="11" fill="#8a919c" text-anchor="end">正文 paper · 外壳 workbench</text>

  <rect x="1062" y="56" width="206" height="26" rx="4" fill="#ede7f5"/>
  <text x="1165" y="73" font-size="12" font-weight="600" fill="#4a2f66" text-anchor="middle">D · Hybrid 混合</text>
</svg>
