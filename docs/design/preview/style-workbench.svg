<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif">
  <defs>
    <filter id="w1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#10141a" flood-opacity="0.06"/>
    </filter>
    <filter id="w2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#10141a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="#f1f3f5"/>

  <!-- 顶栏：紧凑 36 高、36 间距、强分区线 -->
  <rect x="0" y="0" width="1280" height="36" fill="#ffffff"/>
  <line x1="0" y1="36" x2="1280" y2="36" stroke="#cfd5dc"/>
  <circle cx="22" cy="18" r="6" fill="#764ba2"/>
  <text x="36" y="23" font-size="12" font-weight="600" fill="#16181d">白泽笔记</text>
  <g font-size="12" fill="#16181d">
    <text x="140" y="23">文件</text><text x="176" y="23">编辑</text><text x="212" y="23">视图</text>
    <text x="248" y="23">插入</text><text x="284" y="23">设置</text><text x="320" y="23">工具</text>
    <text x="356" y="23">插件</text><text x="392" y="23">帮助</text>
  </g>
  <rect x="984" y="8" width="196" height="20" rx="3" fill="#f4f6f8" stroke="#d9dde3"/>
  <text x="996" y="22" font-size="11" fill="#8a919c">搜索或输入命令</text>
  <rect x="1190" y="8" width="66" height="20" rx="2" fill="#f4f6f8" stroke="#d9dde3"/>
  <text x="1223" y="22" font-size="10" fill="#5b6470" text-anchor="middle">⌘K</text>

  <!-- 左栏：紧凑 24 行高、强分区 -->
  <rect x="0" y="36" width="228" height="740" fill="#f7f8fa"/>
  <line x1="228" y1="36" x2="228" y2="776" stroke="#d9dde3"/>
  <text x="14" y="62" font-size="11" font-weight="600" fill="#8a919c">笔记</text>
  <rect x="8" y="72" width="212" height="22" rx="2" fill="#ede7f5"/>
  <rect x="8" y="72" width="2" height="22" fill="#764ba2"/>
  <text x="18" y="87" font-size="12" fill="#4a2f66">视觉升级方案</text>
  <g font-size="12" fill="#16181d">
    <text x="18" y="111">1.5.2 版本计划</text>
    <text x="18" y="135">代码结构优化计划</text>
    <text x="18" y="159">产品体验优化方案</text>
    <text x="18" y="183">开发规范</text>
    <text x="18" y="207">架构文档</text>
  </g>

  <!-- 编辑区：紧凑正文 14/22 -->
  <text x="264" y="96" font-size="20" font-weight="600" fill="#16181d">BaiZe Notes · 视觉升级</text>
  <g font-size="14" fill="#16181d">
    <text x="264" y="130">高密度工作台：紧凑行高、清晰分区线、克制的状态色。</text>
    <text x="264" y="152">信息层级靠字号与字重，而不是大段留白。</text>
  </g>
  <rect x="264" y="170" width="3" height="48" fill="#764ba2" opacity="0.5"/>
  <g font-size="12" fill="#5b6470">
    <text x="278" y="184">密度三档：compact 24 / default 28 / spacious 32 行高。</text>
    <text x="278" y="204">分区用 border-strong，不叠加多重阴影。</text>
  </g>
  <g font-size="12" fill="#16181d">
    <text x="264" y="248">• 圆角 2/4/6 三档，控件更方</text>
    <text x="264" y="270">• 表格列头 24、分区线 1px</text>
    <text x="264" y="292">• 状态色收敛，仅错误/成功提示</text>
  </g>
  <rect x="264" y="312" width="472" height="54" rx="4" fill="#f4f6f8" stroke="#d9dde3"/>
  <g font-size="11" fill="#5b6470" font-family="Consolas, monospace">
    <text x="278" y="332">const style = 'workbench'</text>
    <text x="278" y="350">// 行高紧凑 + 分区线 + 克制阴影</text>
  </g>
  <rect x="264" y="386" width="472" height="132" rx="4" fill="#ffffff" stroke="#d9dde3"/>
  <rect x="264" y="386" width="472" height="24" rx="4" fill="#f4f6f8"/>
  <line x1="264" y1="410" x2="736" y2="410" stroke="#d9dde3"/>
  <line x1="264" y1="434" x2="736" y2="434" stroke="#e8ecf0"/>
  <line x1="264" y1="458" x2="736" y2="458" stroke="#e8ecf0"/>
  <line x1="264" y1="482" x2="736" y2="482" stroke="#e8ecf0"/>
  <g font-size="11" fill="#8a919c">
    <text x="276" y="403">组件</text><text x="404" y="403">规格</text><text x="584" y="403">工作台差异</text>
  </g>
  <g font-size="11" fill="#16181d">
    <text x="276" y="429">菜单栏</text><text x="404" y="429">高 32 / 行高 24</text><text x="584" y="429">hairline + 强分区</text>
    <text x="276" y="453">工具窗</text><text x="404" y="453">圆角 6 / 标题 36</text><text x="584" y="453">阴影仅 1 档</text>
    <text x="276" y="477">表格</text><text x="404" y="477">行高 24 / 列头 24</text><text x="584" y="477">列头底色 + 网格线</text>
    <text x="276" y="501">命令面板</text><text x="404" y="501">行高 28</text><text x="584" y="501">选中左侧 2px 条</text>
  </g>

  <!-- 工具窗：紧凑、小圆角、单档阴影 -->
  <rect x="784" y="120" width="416" height="392" rx="6" fill="#ffffff" stroke="#d9dde3" filter="url(#w2)"/>
  <rect x="784" y="120" width="416" height="36" rx="6" fill="#f4f6f8"/>
  <line x1="784" y1="156" x2="1200" y2="156" stroke="#d9dde3"/>
  <g fill="#8a919c"><circle cx="800" cy="138" r="2"/><circle cx="807" cy="138" r="2"/><circle cx="814" cy="138" r="2"/><circle cx="800" cy="144" r="2"/><circle cx="807" cy="144" r="2"/><circle cx="814" cy="144" r="2"/></g>
  <text x="828" y="143" font-size="12" font-weight="600" fill="#16181d">Mermaid 工具窗</text>
  <circle cx="1160" cy="138" r="10" fill="#e8ecf0"/>
  <text x="1160" y="142" font-size="11" fill="#5b6470" text-anchor="middle">–</text>
  <circle cx="1184" cy="138" r="10" fill="#e8ecf0"/>
  <text x="1184" y="142" font-size="11" fill="#5b6470" text-anchor="middle">×</text>

  <rect x="800" y="172" width="384" height="212" rx="4" fill="#ffffff" stroke="#d9dde3"/>
  <rect x="800" y="172" width="384" height="24" rx="4" fill="#f4f6f8"/>
  <line x1="800" y1="196" x2="1184" y2="196" stroke="#d9dde3"/>
  <line x1="800" y1="220" x2="1184" y2="220" stroke="#e8ecf0"/>
  <line x1="800" y1="244" x2="1184" y2="244" stroke="#e8ecf0"/>
  <line x1="800" y1="268" x2="1184" y2="268" stroke="#e8ecf0"/>
  <line x1="908" y1="172" x2="908" y2="384" stroke="#e8ecf0"/>
  <line x1="1044" y1="172" x2="1044" y2="384" stroke="#e8ecf0"/>
  <g font-size="11" fill="#8a919c">
    <text x="812" y="189">标题</text><text x="920" y="189">状态</text><text x="1056" y="189">更新</text>
  </g>
  <g font-size="11" fill="#16181d">
    <text x="812" y="213">纸感正文</text><text x="920" y="213">已就绪</text><text x="1056" y="213">11-27</text>
    <text x="812" y="237">轻玻璃悬浮层</text><text x="920" y="237">实验</text><text x="1056" y="237">11-27</text>
    <text x="812" y="261">工作台密度</text><text x="920" y="261">已就绪</text><text x="1056" y="261">11-27</text>
    <text x="812" y="285">紧凑模式</text><text x="920" y="285">可选</text><text x="1056" y="285">11-27</text>
  </g>
  <rect x="1040" y="352" width="64" height="26" rx="2" fill="#764ba2"/>
  <text x="1072" y="369" font-size="11" fill="#ffffff" text-anchor="middle">插入</text>
  <rect x="1112" y="352" width="64" height="26" rx="2" fill="#f4f6f8" stroke="#d9dde3"/>
  <text x="1144" y="369" font-size="11" fill="#3d4250" text-anchor="middle">取消</text>

  <!-- 状态栏 -->
  <rect x="0" y="776" width="1280" height="24" fill="#ffffff"/>
  <line x1="0" y1="776" x2="1280" y2="776" stroke="#cfd5dc"/>
  <text x="12" y="792" font-size="11" fill="#8a919c">已保存 · UTF-8 · 1,234 字</text>
  <text x="1268" y="792" font-size="11" fill="#8a919c" text-anchor="end">Markdown · 预览同步</text>

  <rect x="1084" y="56" width="184" height="26" rx="4" fill="#ede7f5"/>
  <text x="1176" y="73" font-size="12" font-weight="600" fill="#4a2f66" text-anchor="middle">C · Workbench 工作台</text>
</svg>
