<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif">
  <defs>
    <filter id="p1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#3a3428" flood-opacity="0.07"/>
    </filter>
    <filter id="p2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#3a3428" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- 背景：暖白纸面 -->
  <rect width="1280" height="800" fill="#f7f5f0"/>

  <!-- 顶栏（纸感：宽松 44 间距、hairline 底边） -->
  <rect x="0" y="0" width="1280" height="48" fill="#fffdf8"/>
  <line x1="0" y1="48" x2="1280" y2="48" stroke="#e8e3d8" stroke-width="1"/>
  <circle cx="26" cy="24" r="7" fill="#764ba2"/>
  <text x="42" y="29" font-size="13" font-weight="600" fill="#2b2620">白泽笔记</text>
  <g font-size="13" fill="#2b2620">
    <text x="160" y="29">文件</text><text x="204" y="29">编辑</text><text x="248" y="29">视图</text>
    <text x="292" y="29">插入</text><text x="336" y="29">设置</text><text x="380" y="29">工具</text>
    <text x="424" y="29">插件</text><text x="468" y="29">帮助</text>
  </g>
  <rect x="962" y="12" width="208" height="24" rx="12" fill="#f2efe8" stroke="#e8e3d8"/>
  <text x="976" y="28" font-size="12" fill="#9b9285">搜索或输入命令</text>
  <rect x="1180" y="12" width="76" height="24" rx="4" fill="#efeae0" stroke="#e8e3d8"/>
  <text x="1218" y="28" font-size="11" fill="#7a7166" text-anchor="middle">⌘K</text>

  <!-- 左栏：文件树（纸感行高 28） -->
  <rect x="0" y="48" width="240" height="720" fill="#fbf9f4"/>
  <line x1="240" y1="48" x2="240" y2="768" stroke="#e8e3d8"/>
  <text x="16" y="78" font-size="12" font-weight="600" fill="#9b9285">笔记</text>
  <rect x="8" y="92" width="224" height="26" rx="4" fill="#efe9f5"/>
  <text x="20" y="109" font-size="13" fill="#5b3f78">视觉升级方案</text>
  <g font-size="13" fill="#2b2620">
    <text x="20" y="137">1.5.2 版本计划</text>
    <text x="20" y="165">代码结构优化计划</text>
    <text x="20" y="193">产品体验优化方案</text>
    <text x="20" y="221">开发规范</text>
    <text x="20" y="249">架构文档</text>
  </g>

  <!-- 编辑区：正文（纸感 16/行高 26） -->
  <text x="280" y="112" font-size="22" font-weight="600" fill="#2b2620">BaiZe Notes · 视觉升级</text>
  <g font-size="16" fill="#2b2620">
    <text x="280" y="152">写作优先的纸感：低饱和纸面、1px 细线、克制的阴影。</text>
    <text x="280" y="178">同一套主题色，换风格只改材质。</text>
  </g>
  <rect x="280" y="200" width="3" height="52" fill="#c9b6e4"/>
  <g font-size="13" fill="#7a7166">
    <text x="296" y="216">内容大于装饰：正文行高 1.75，段落留白 0.75em。</text>
    <text x="296" y="238">引用条只用 3px 强调色 30%，不加背景块。</text>
  </g>
  <g font-size="13" fill="#2b2620">
    <text x="280" y="286">• 圆角 4/6 两档，控件与卡片区分</text>
    <text x="280" y="310">• 阴影仅用于悬浮层，减弱 40%</text>
    <text x="280" y="334">• 分隔线统一 1px hairline</text>
  </g>
  <rect x="280" y="356" width="440" height="62" rx="6" fill="#f2efe8" stroke="#e8e3d8"/>
  <g font-size="11" fill="#7a7166" font-family="Consolas, monospace">
    <text x="296" y="378">const style = 'paper'</text>
    <text x="296" y="396">// 不改变主题色相，仅覆盖材质令牌</text>
  </g>
  <rect x="280" y="440" width="440" height="120" rx="6" fill="#fffdf8" stroke="#e8e3d8"/>
  <line x1="280" y1="472" x2="720" y2="472" stroke="#e8e3d8"/>
  <line x1="280" y1="504" x2="720" y2="504" stroke="#f0eae0"/>
  <line x1="280" y1="536" x2="720" y2="536" stroke="#f0eae0"/>
  <g font-size="11" fill="#7a7166">
    <text x="292" y="460">组件</text><text x="420" y="460">规格</text><text x="580" y="460">风格差异</text>
  </g>
  <g font-size="11" fill="#2b2620">
    <text x="292" y="492">菜单栏</text><text x="420" y="492">高 36 / 行高 28</text><text x="580" y="492">hairline + 无阴影</text>
    <text x="292" y="524">工具窗</text><text x="420" y="524">圆角 8 / 标题 40</text><text x="580" y="524">阴影减弱 40%</text>
    <text x="292" y="556">表格</text><text x="420" y="556">行高 32 / 列头 32</text><text x="580" y="556">边框 hairline</text>
  </g>

  <!-- 右侧工具窗（悬浮，纸感：8 圆角、轻阴影） -->
  <rect x="760" y="132" width="440" height="396" rx="8" fill="#fffdf8" stroke="#e8e3d8" filter="url(#p2)"/>
  <line x1="760" y1="172" x2="1200" y2="172" stroke="#e8e3d8"/>
  <g fill="#9b9285"><circle cx="778" cy="152" r="2"/><circle cx="786" cy="152" r="2"/><circle cx="794" cy="152" r="2"/><circle cx="778" cy="158" r="2"/><circle cx="786" cy="158" r="2"/><circle cx="794" cy="158" r="2"/></g>
  <text x="812" y="157" font-size="13" font-weight="600" fill="#2b2620">Mermaid 工具窗</text>
  <circle cx="1158" cy="152" r="10" fill="#f2efe8"/>
  <text x="1158" y="156" font-size="12" fill="#7a7166" text-anchor="middle">–</text>
  <circle cx="1180" cy="152" r="10" fill="#f2efe8"/>
  <text x="1180" y="156" font-size="12" fill="#7a7166" text-anchor="middle">×</text>

  <!-- 工具窗内表格 -->
  <rect x="776" y="188" width="408" height="220" rx="6" fill="#fffdf8" stroke="#e8e3d8"/>
  <line x1="776" y1="220" x2="1184" y2="220" stroke="#e8e3d8"/>
  <line x1="776" y1="252" x2="1184" y2="252" stroke="#f0eae0"/>
  <line x1="776" y1="284" x2="1184" y2="284" stroke="#f0eae0"/>
  <line x1="776" y1="316" x2="1184" y2="316" stroke="#f0eae0"/>
  <g font-size="11" fill="#7a7166">
    <text x="788" y="208">标题</text><text x="920" y="208">状态</text><text x="1060" y="208">更新</text>
  </g>
  <g font-size="11" fill="#2b2620">
    <text x="788" y="240">纸感正文</text><text x="920" y="240">已就绪</text><text x="1060" y="240">11-27</text>
    <text x="788" y="272">轻玻璃悬浮层</text><text x="920" y="272">实验</text><text x="1060" y="272">11-27</text>
    <text x="788" y="304">工作台密度</text><text x="920" y="304">已就绪</text><text x="1060" y="304">11-27</text>
  </g>
  <rect x="1020" y="356" width="76" height="32" rx="4" fill="#764ba2"/>
  <text x="1058" y="377" font-size="12" fill="#ffffff" text-anchor="middle">插入</text>
  <rect x="1108" y="356" width="76" height="32" rx="4" fill="#f2efe8" stroke="#e8e3d8"/>
  <text x="1146" y="377" font-size="12" fill="#5f5a52" text-anchor="middle">取消</text>

  <!-- 状态栏 -->
  <rect x="0" y="768" width="1280" height="32" fill="#fbf9f4"/>
  <line x1="0" y1="768" x2="1280" y2="768" stroke="#e8e3d8"/>
  <text x="16" y="788" font-size="12" fill="#9b9285">已保存 · UTF-8 · 1,234 字</text>
  <text x="1264" y="788" font-size="12" fill="#9b9285" text-anchor="end">Markdown · 预览同步</text>

  <!-- 风格标签 -->
  <rect x="1088" y="64" width="176" height="28" rx="14" fill="#efe9f5"/>
  <text x="1176" y="83" font-size="12" font-weight="600" fill="#5b3f78" text-anchor="middle">A · Paper 纸感</text>
</svg>
