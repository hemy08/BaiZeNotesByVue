      .btitle { font-size: 14.5px; font-weight: 700; fill: #1e293b; }
      .bdesc { font-size: 12.5px; fill: #334155; }
      .risk { font-size: 11.5px; fill: #b91c1c; font-weight: 600; }
      .eff { font-size: 11.5px; fill: #475569; }
