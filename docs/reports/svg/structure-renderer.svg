<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 880" width="1100" height="880" role="img" aria-label="渲染层分层与组件树">
  <defs>
    <marker id="r-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="r-arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; fill: #1f2328; }
      .title { font-size: 23px; font-weight: 700; }
      .sub { font-size: 13.5px; fill: #475569; }
      .legend { font-size: 12.5px; fill: #475569; }
      .layer { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.6; rx: 12; }
      .lbl { font-size: 14px; font-weight: 700; fill: #334155; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.3; rx: 8; }
      .ctitle { font-size: 14.5px; font-weight: 700; fill: #0f766e; }
      .cdesc { font-size: 13px; fill: #334155; }
      .flow { stroke: #2563eb; stroke-width: 2.2; fill: none; }
      .flowg { stroke: #16a34a; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
      .sect { font-size: 12.5px; fill: #475569; }
    </style>
  </defs>

  <text x="16" y="32" class="title">图 3 · 渲染层分层与组件树</text>
  <text x="16" y="54" class="sub">双段式外壳（欢迎页 / 主界面）：欢迎页入口 chunk ≈ 114 KB，主界面（Monaco + 预览 ≈ 9.6 MB）整体异步加载</text>
  <line x1="880" y1="48" x2="906" y2="48" class="flow" marker-end="url(#r-ar)"/>
  <text x="914" y="52" class="legend">分层依赖</text>
  <line x1="1010" y1="48" x2="1036" y2="48" class="flowg" marker-end="url(#r-arg)"/>
  <text x="1044" y="52" class="legend">契约</text>

  <!-- 左：分层 -->
  <rect x="16" y="82" width="800" height="104" class="layer"/>
  <text x="30" y="108" class="lbl">L0</text><text x="30" y="126" class="lbl">入口</text>
  <rect x="110" y="94" width="216" height="80" class="card"/>
  <text x="122" y="118" class="ctitle">index.html</text>
  <text x="122" y="140" class="cdesc">CSP · 外链 CSS</text>
  <rect x="338" y="94" width="216" height="80" class="card"/>
  <text x="350" y="118" class="ctitle">main.ts</text>
  <text x="350" y="140" class="cdesc">CSS / ContextMenu / i18n 初始化</text>
  <rect x="566" y="94" width="238" height="80" class="card"/>
  <text x="578" y="118" class="ctitle">App.vue（双段式）</text>
  <text x="578" y="140" class="cdesc">欢迎页 / 主界面切换 + READY 握手</text>

  <rect x="16" y="198" width="800" height="110" class="layer"/>
  <text x="30" y="224" class="lbl">L1</text><text x="30" y="242" class="lbl">壳层</text>
  <rect x="110" y="210" width="242" height="86" class="card"/>
  <text x="122" y="234" class="ctitle">WelcomeScreen</text>
  <text x="122" y="256" class="cdesc">打开文件 / 文件夹 / 最近记录</text>
  <rect x="364" y="210" width="440" height="86" class="card"/>
  <text x="376" y="234" class="ctitle">BaiZeNotes.vue（主界面壳）</text>
  <text x="376" y="256" class="cdesc">标题栏 · 窗口控制 · 主题应用 · 全局事件 · 快捷键</text>
  <text x="376" y="276" class="cdesc">18 个 Vue 对话框统一宿主</text>

  <rect x="16" y="320" width="800" height="112" class="layer"/>
  <text x="30" y="346" class="lbl">L2</text><text x="30" y="364" class="lbl">布局</text>
  <rect x="110" y="332" width="222" height="88" class="card"/>
  <text x="122" y="356" class="ctitle">MenuBar</text>
  <text x="122" y="378" class="cdesc">menu-config 数据驱动菜单</text>
  <text x="122" y="398" class="cdesc">13 个顶层菜单 + 动作分发</text>
  <rect x="344" y="332" width="266" height="88" class="card"/>
  <text x="356" y="356" class="ctitle">WorkSpace</text>
  <text x="356" y="378" class="cdesc">分栏容器：编辑 / 预览 / 资源管理器</text>
  <text x="356" y="398" class="cdesc">HTML / PDF 查看器</text>
  <rect x="622" y="332" width="182" height="88" class="card"/>
  <text x="634" y="356" class="ctitle">StatusBar</text>
  <text x="634" y="378" class="cdesc">行列 / 编码 / 语言</text>
  <text x="634" y="398" class="cdesc">消息与错误镜像</text>

  <rect x="16" y="444" width="800" height="232" class="layer"/>
  <text x="30" y="470" class="lbl">L3</text><text x="30" y="488" class="lbl">业务域</text>
  <rect x="110" y="456" width="222" height="104" class="card"/>
  <text x="122" y="480" class="ctitle">Markdown 编辑域</text>
  <text x="122" y="502" class="cdesc">Container / EditTools / Monaco</text>
  <text x="122" y="522" class="cdesc">击键防抖 · 脏指纹 · 模式切换</text>
  <text x="122" y="542" class="cdesc">工具栏 / 写作模板 / 快捷键</text>
  <rect x="344" y="456" width="268" height="104" class="card"/>
  <text x="356" y="480" class="ctitle">预览渲染域（单跳本地）</text>
  <text x="356" y="502" class="cdesc">preview-local-render（KaTeX / URL）</text>
  <text x="356" y="522" class="cdesc">mkdocs / basic / media / blocks 四层插件</text>
  <text x="356" y="542" class="cdesc">mermaid / PlantUML · DOMPurify · TOC</text>
  <rect x="624" y="456" width="180" height="104" class="card"/>
  <text x="636" y="480" class="ctitle">ResourceManager</text>
  <text x="636" y="502" class="cdesc">文件树 / 右键菜单</text>
  <text x="636" y="522" class="cdesc">TOC 大纲</text>
  <rect x="110" y="570" width="222" height="92" class="card"/>
  <text x="122" y="594" class="ctitle">PluginTools</text>
  <text x="122" y="616" class="cdesc">38 个插件工具（懒加载）</text>
  <text x="122" y="636" class="cdesc">纯函数 lib + Vue 页面</text>
  <rect x="344" y="570" width="170" height="92" class="card"/>
  <text x="356" y="594" class="ctitle">HemyTools</text>
  <text x="356" y="616" class="cdesc">HTML / PDF 查看</text>
  <text x="356" y="636" class="cdesc">按需挂载</text>
  <rect x="526" y="570" width="278" height="92" class="card"/>
  <text x="538" y="594" class="ctitle">Vue 对话框 × 18</text>
  <text x="538" y="616" class="cdesc">dialogs/index.ts 统一懒加载注册表</text>
  <text x="538" y="636" class="cdesc">插入 / 设置 / 消息 / 主题 / 编辑器</text>

  <rect x="16" y="688" width="800" height="104" class="layer"/>
  <text x="30" y="714" class="lbl">L4</text><text x="30" y="732" class="lbl">基础设施</text>
  <rect x="110" y="700" width="420" height="80" class="card"/>
  <text x="122" y="724" class="ctitle">common</text>
  <text x="122" y="746" class="cdesc">useConfigStore 单例 · EventBus（24 事件）· 响应式 i18n</text>
  <text x="122" y="766" class="cdesc">主题 CSS 变量（28 套应用主题）· logger</text>
  <rect x="542" y="700" width="262" height="80" class="card"/>
  <text x="554" y="724" class="ctitle">composables</text>
  <text x="554" y="746" class="cdesc">useDialogDrag · useWindowManagement</text>
  <text x="554" y="766" class="cdesc">窗口 / 对话框拖拽缩放</text>

  <!-- 右侧：跨层契约 -->
  <rect x="832" y="82" width="252" height="170" class="layer"/>
  <text x="848" y="108" class="lbl">shared 单一真源</text>
  <rect x="846" y="120" width="224" height="112" class="card"/>
  <text x="858" y="144" class="cdesc">· ipc-channels：92 通道 / 17 组</text>
  <text x="858" y="166" class="cdesc">· types：9 领域</text>
  <text x="858" y="188" class="cdesc">· i18n：12 命名空间 × 1,821 词条</text>
  <text x="858" y="210" class="cdesc">· main 37 + renderer 31 文件消费</text>

  <rect x="832" y="264" width="252" height="150" class="layer"/>
  <text x="848" y="290" class="lbl">与主进程通信</text>
  <rect x="846" y="302" width="224" height="92" class="card"/>
  <text x="858" y="326" class="cdesc">· invoke / send（请求-响应）</text>
  <text x="858" y="348" class="cdesc">· ipcRenderer.on（事件 / 广播）</text>
  <text x="858" y="370" class="cdesc">· preload 白名单双向受限</text>

  <rect x="832" y="426" width="252" height="188" class="layer"/>
  <text x="848" y="452" class="lbl">工程约束</text>
  <rect x="846" y="464" width="224" height="130" class="card"/>
  <text x="858" y="488" class="cdesc">· sandbox + contextIsolation</text>
  <text x="858" y="510" class="cdesc">· preload 单文件（isolatedEntries）</text>
  <text x="858" y="532" class="cdesc">· CSP：script-src 'self'</text>
  <text x="858" y="554" class="cdesc">· 主题一律 CSS 变量</text>
  <text x="858" y="576" class="cdesc">· 禁止渲染层直接使用 Node 能力</text>

  <rect x="832" y="626" width="252" height="166" class="layer"/>
  <text x="848" y="652" class="lbl">体积口径（实测）</text>
  <rect x="846" y="664" width="224" height="108" class="card"/>
  <text x="858" y="688" class="cdesc">· 入口 chunk ≈ 114 KB</text>
  <text x="858" y="710" class="cdesc">· 主界面异步块 ≈ 9.6 MB</text>
  <text x="858" y="732" class="cdesc">· out/renderer ≈ 24.1 MiB</text>
  <text x="858" y="754" class="cdesc">· 38 工具 / 18 对话框按需加载</text>

  <!-- 箭头 -->
  <line x1="410" y1="186" x2="410" y2="198" class="flow" marker-end="url(#r-ar)"/>
  <line x1="410" y1="308" x2="410" y2="320" class="flow" marker-end="url(#r-ar)"/>
  <line x1="410" y1="432" x2="410" y2="444" class="flow" marker-end="url(#r-ar)"/>
  <line x1="410" y1="676" x2="410" y2="688" class="flow" marker-end="url(#r-ar)"/>

  <!-- 底部注释 -->
  <rect x="16" y="812" width="1068" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="32" y="836" class="sect">欢迎页与主界面为 v-if 双段式：入口只负责欢迎页 + 语言 / CSS / 右键菜单；主界面异步加载 + loading / error / 重试兜底。无 Vue Router，界面状态由 welcome-state 与 store 驱动。</text>
  <text x="32" y="858" class="sect">61 处动态 import 构成全部懒加载边界（18 对话框 + 38 插件 + 6 类重型依赖），electron.vite.config 中无手工 manualChunks。</text>
</svg>
