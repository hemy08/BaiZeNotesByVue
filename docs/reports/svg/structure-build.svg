<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" width="1120" height="800" role="img" aria-label="构建测试发布与文档流水线">
  <defs>
    <marker id="b-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="b-arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; fill: #1f2328; }
      .title { font-size: 23px; font-weight: 700; }
      .sub { font-size: 13.5px; fill: #475569; }
      .legend { font-size: 12.5px; fill: #475569; }
      .lane { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 12; }
      .lanetitle { font-size: 15px; font-weight: 700; fill: #334155; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 8; }
      .gate { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 8; }
      .out { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; rx: 8; }
      .ctitle { font-size: 14.5px; font-weight: 700; fill: #1e3a8a; }
      .cdesc { font-size: 13px; fill: #334155; }
      .note { font-size: 12.5px; fill: #64748b; }
      .flow { stroke: #2563eb; stroke-width: 2.2; fill: none; }
      .flowg { stroke: #16a34a; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <text x="16" y="32" class="title">图 5 · 构建、测试、发布与文档流水线</text>
  <text x="16" y="54" class="sub">质量门禁与构建解耦；打包前必过构建目录防护脚本；文档由 md 自动生成 HTML Wiki</text>
  <line x1="900" y1="48" x2="926" y2="48" class="flow" marker-end="url(#b-ar)"/>
  <text x="934" y="52" class="legend">流水线步骤</text>
  <line x1="1020" y1="48" x2="1046" y2="48" class="flowg" marker-end="url(#b-arg)"/>
  <text x="1054" y="52" class="legend">产物</text>

  <!-- ① 质量门禁 -->
  <rect x="16" y="84" width="1088" height="176" class="lane"/>
  <text x="34" y="110" class="lanetitle">① 质量门禁（本地 npm scripts · CI quality-gate job 覆盖 typecheck / ESLint / Vitest）</text>
  <rect x="34" y="122" width="200" height="118" class="gate"/>
  <text x="48" y="146" class="ctitle">typecheck</text>
  <text x="48" y="168" class="cdesc">三工程：node / web / test</text>
  <text x="48" y="188" class="cdesc">vue-tsc + tsc --noEmit</text>
  <text x="48" y="208" class="cdesc">0 错误基线</text>
  <rect x="246" y="122" width="200" height="118" class="gate"/>
  <text x="260" y="146" class="ctitle">ESLint + Prettier</text>
  <text x="260" y="168" class="cdesc">flat config</text>
  <text x="260" y="188" class="cdesc">0 error / 0 warning</text>
  <text x="260" y="208" class="cdesc">format:check 可用</text>
  <rect x="458" y="122" width="200" height="118" class="gate"/>
  <text x="472" y="146" class="ctitle">Vitest</text>
  <text x="472" y="168" class="cdesc">172 测试文件 · 3,272 用例</text>
  <text x="472" y="188" class="cdesc">jsdom 52 文件</text>
  <text x="472" y="208" class="cdesc">契约 / 不变量测试</text>
  <rect x="670" y="122" width="200" height="118" class="gate"/>
  <text x="684" y="146" class="ctitle">Playwright E2E</text>
  <text x="684" y="168" class="cdesc">Electron 冒烟 4 条</text>
  <text x="684" y="188" class="cdesc">CI e2e job</text>
  <text x="684" y="208" class="cdesc">可选依赖安装</text>
  <rect x="882" y="122" width="200" height="118" class="gate"/>
  <text x="896" y="146" class="ctitle">安全审计</text>
  <text x="896" y="168" class="cdesc">npm audit（prod / all）</text>
  <text x="896" y="188" class="cdesc">生产依赖 0 漏洞</text>
  <text x="896" y="208" class="cdesc">依赖边界探查</text>
  <text x="34" y="254" class="note">CI：.github/workflows/ci.yml 双 job（quality-gate / e2e，失败上传报告）；本地命令：npm run typecheck / lint / test / test:coverage / test:e2e。</text>

  <!-- ② 构建与打包 -->
  <rect x="16" y="274" width="1088" height="196" class="lane"/>
  <text x="34" y="300" class="lanetitle">② 构建与打包（electron-vite 6 + electron-builder 26）</text>
  <rect x="34" y="312" width="200" height="128" class="card"/>
  <text x="48" y="336" class="ctitle">generate-version</text>
  <text x="48" y="358" class="cdesc">版本 / 依赖版本写入</text>
  <text x="48" y="378" class="cdesc">resources/config/version.json</text>
  <rect x="246" y="312" width="200" height="128" class="card"/>
  <text x="260" y="336" class="ctitle">electron-vite build</text>
  <text x="260" y="358" class="cdesc">main（依赖外部化）</text>
  <text x="260" y="378" class="cdesc">preload（单文件隔离）</text>
  <text x="260" y="398" class="cdesc">renderer（异步分包）</text>
  <rect x="458" y="312" width="200" height="128" class="card"/>
  <text x="472" y="336" class="ctitle">prepare-build-dirs</text>
  <text x="472" y="358" class="cdesc">构建目录完整性级别校正</text>
  <text x="472" y="378" class="cdesc">修复 NSIS 临时文件失败</text>
  <rect x="670" y="312" width="200" height="128" class="card"/>
  <text x="684" y="336" class="ctitle">electron-builder</text>
  <text x="684" y="358" class="cdesc">asar + extraResources</text>
  <text x="684" y="378" class="cdesc">files 白名单</text>
  <text x="684" y="398" class="cdesc">NSIS / portable</text>
  <rect x="882" y="312" width="200" height="128" class="out"/>
  <text x="896" y="336" class="ctitle">dist/ 产物</text>
  <text x="896" y="358" class="cdesc">NSIS：118.41 MiB</text>
  <text x="896" y="378" class="cdesc">portable：107.46 MiB</text>
  <text x="896" y="398" class="cdesc">latest.yml · blockmap</text>
  <line x1="234" y1="372" x2="246" y2="372" class="flow" marker-end="url(#b-ar)"/>
  <line x1="446" y1="372" x2="458" y2="372" class="flow" marker-end="url(#b-ar)"/>
  <line x1="658" y1="372" x2="670" y2="372" class="flow" marker-end="url(#b-ar)"/>
  <line x1="870" y1="372" x2="882" y2="372" class="flow" marker-end="url(#b-ar)"/>
  <text x="34" y="458" class="note">体积口径：out/main ≈ 10.50 MiB（含内联 jsdom）、out/renderer ≈ 24.21 MiB、app.asar ≈ 50.11 MiB；失败常见原因：preload 非单文件、构建目录完整性级别、并行写冲突。</text>

  <!-- ③ 文档流水线 -->
  <rect x="16" y="484" width="1088" height="176" class="lane"/>
  <text x="34" y="510" class="lanetitle">③ 文档与报告流水线</text>
  <rect x="34" y="522" width="200" height="118" class="card"/>
  <text x="48" y="546" class="ctitle">报告 Markdown 源</text>
  <text x="48" y="568" class="cdesc">docs/reports/md/&lt;分类&gt;/*.md</text>
  <text x="48" y="588" class="cdesc">顶部 report-nav 导航行</text>
  <text x="48" y="608" class="cdesc">正文 + SVG 占位</text>
  <rect x="246" y="522" width="200" height="118" class="card"/>
  <text x="260" y="546" class="ctitle">build-html-report</text>
  <text x="260" y="568" class="cdesc">md → HTML 单页</text>
  <text x="260" y="588" class="cdesc">固定悬浮目录 + 卡片</text>
  <text x="260" y="608" class="cdesc">SVG 图自动内嵌</text>
  <rect x="458" y="522" width="200" height="118" class="card"/>
  <text x="472" y="546" class="ctitle">generate-report-wiki</text>
  <text x="472" y="568" class="cdesc">批量注入顶部导航</text>
  <text x="472" y="588" class="cdesc">自动同步导航 / 侧边栏</text>
  <text x="472" y="608" class="cdesc">生成 Wiki 首页</text>
  <rect x="670" y="522" width="200" height="118" class="out"/>
  <text x="684" y="546" class="ctitle">docs/reports/html</text>
  <text x="684" y="568" class="cdesc">23 页 HTML Wiki</text>
  <text x="684" y="588" class="cdesc">首页 + 3 分类 + 悬浮目录</text>
  <text x="684" y="608" class="cdesc">浏览器直接打开</text>
  <rect x="882" y="522" width="200" height="118" class="card"/>
  <text x="896" y="546" class="ctitle">docs/wiki</text>
  <text x="896" y="568" class="cdesc">项目文档 5 类 27 篇</text>
  <text x="896" y="588" class="cdesc">与 reports 分离维护</text>
  <line x1="234" y1="582" x2="246" y2="582" class="flow" marker-end="url(#b-ar)"/>
  <line x1="446" y1="582" x2="458" y2="582" class="flow" marker-end="url(#b-ar)"/>
  <line x1="658" y1="582" x2="670" y2="582" class="flow" marker-end="url(#b-ar)"/>
  <text x="34" y="660" class="note">本报告已按此流水线归档：写 md → 更新 README 索引 → 运行生成器 → HTML Wiki 自动同步（导航 / 侧边栏 / 首页 / SVG 图）。</text>

  <!-- 发布现状 -->
  <rect x="16" y="684" width="1088" height="96" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="34" y="712" class="ctitle" style="fill:#b91c1c">发布现状（结构风险 H7）</text>
  <text x="34" y="736" class="cdesc">仅 Windows 发布（NSIS + portable）；打包 / 签名 / 更新源验证未纳入 CI，发布依赖本地手工链；git tag：release-1.3.6 / release-1.3.7 / release-1.3.8 已发布。</text>
  <text x="34" y="760" class="cdesc">macOS / Linux 配置存在但为占位，无签名与 entitlements；更新器 latest.yml 已指向 GitHub Releases，但 CI 未验证可用性。</text>

  <!-- 底部说明 -->
  <rect x="16" y="786" width="1088" height="0" fill="none"/>
</svg>
