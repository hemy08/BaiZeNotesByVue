<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 渐变背景 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    
    <!-- 树叶渐变 - 绿色 -->
    <linearGradient id="leafGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#66BB6A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#81C784;stop-opacity:1" />
    </linearGradient>
    
    <!-- 树叶渐变 - 深绿 -->
    <linearGradient id="leafDarkGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E7D32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#43A047;stop-opacity:1" />
    </linearGradient>
    
    <!-- 树叶渐变 - 浅绿 -->
    <linearGradient id="leafLightGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#81C784;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A5D6A7;stop-opacity:1" />
    </linearGradient>
    
    <!-- 阴影效果 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    
    <!-- 树叶阴影 -->
    <filter id="leafShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    
    <!-- 立体文字阴影 -->
    <filter id="text3D" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="1" dy="1" stdDeviation="0" flood-color="#000" flood-opacity="0.7"/>
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#000" flood-opacity="0.6"/>
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000" flood-opacity="0.5"/>
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000" flood-opacity="0.4"/>
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000" flood-opacity="0.3"/>
      <feDropShadow dx="6" dy="6" stdDeviation="1" flood-color="#000" flood-opacity="0.2"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#fff" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- 顶部树叶群 -->
  <g filter="url(#leafShadow)">
    <!-- 顶部中央大叶 -->
    <path d="M 256 60 Q 280 80 290 110 Q 300 140 280 160 Q 260 180 256 180 Q 252 180 232 160 Q 212 140 222 110 Q 232 80 256 60 Z" 
          fill="url(#leafGreen)" opacity="0.9"/>
    <path d="M 256 80 L 256 160" stroke="#2E7D32" stroke-width="2" opacity="0.6"/>
    
    <!-- 顶部左侧叶 -->
    <path d="M 180 80 Q 200 90 210 115 Q 220 140 205 155 Q 190 170 180 165 Q 170 160 165 135 Q 160 110 180 80 Z" 
          fill="url(#leafDarkGreen)" opacity="0.85"/>
    <path d="M 180 95 L 185 155" stroke="#1B5E20" stroke-width="1.5" opacity="0.5"/>
    
    <!-- 顶部右侧叶 -->
    <path d="M 332 80 Q 312 90 302 115 Q 292 140 307 155 Q 322 170 332 165 Q 342 160 347 135 Q 352 110 332 80 Z" 
          fill="url(#leafDarkGreen)" opacity="0.85"/>
    <path d="M 332 95 L 327 155" stroke="#1B5E20" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- 左侧树叶群 -->
  <g filter="url(#leafShadow)">
    <!-- 左侧中央大叶 -->
    <path d="M 60 256 Q 80 232 110 222 Q 140 212 160 232 Q 180 252 180 256 Q 180 260 160 280 Q 140 300 110 290 Q 80 280 60 256 Z" 
          fill="url(#leafGreen)" opacity="0.9"/>
    <path d="M 80 256 L 160 256" stroke="#2E7D32" stroke-width="2" opacity="0.6"/>
    
    <!-- 左上叶 -->
    <path d="M 80 180 Q 90 200 115 210 Q 140 220 155 205 Q 170 190 165 180 Q 160 170 135 165 Q 110 160 80 180 Z" 
          fill="url(#leafLightGreen)" opacity="0.85"/>
    <path d="M 95 180 L 155 185" stroke="#43A047" stroke-width="1.5" opacity="0.5"/>
    
    <!-- 左下叶 -->
    <path d="M 80 332 Q 90 312 115 302 Q 140 292 155 307 Q 170 322 165 332 Q 160 342 135 347 Q 110 352 80 332 Z" 
          fill="url(#leafLightGreen)" opacity="0.85"/>
    <path d="M 95 332 L 155 327" stroke="#43A047" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- 右侧树叶群 -->
  <g filter="url(#leafShadow)">
    <!-- 右侧中央大叶 -->
    <path d="M 452 256 Q 432 280 402 290 Q 372 300 352 280 Q 332 260 332 256 Q 332 252 352 232 Q 372 212 402 222 Q 432 232 452 256 Z" 
          fill="url(#leafGreen)" opacity="0.9"/>
    <path d="M 432 256 L 352 256" stroke="#2E7D32" stroke-width="2" opacity="0.6"/>
    
    <!-- 右上叶 -->
    <path d="M 432 180 Q 422 200 397 210 Q 372 220 357 205 Q 342 190 347 180 Q 352 170 377 165 Q 402 160 432 180 Z" 
          fill="url(#leafLightGreen)" opacity="0.85"/>
    <path d="M 417 180 L 357 185" stroke="#43A047" stroke-width="1.5" opacity="0.5"/>
    
    <!-- 右下叶 -->
    <path d="M 432 332 Q 422 312 397 302 Q 372 292 357 307 Q 342 322 347 332 Q 352 342 377 347 Q 402 352 432 332 Z" 
          fill="url(#leafLightGreen)" opacity="0.85"/>
    <path d="M 417 332 L 357 327" stroke="#43A047" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- 底部树叶群 -->
  <g filter="url(#leafShadow)">
    <!-- 底部中央大叶 -->
    <path d="M 256 452 Q 232 432 222 402 Q 212 372 232 352 Q 252 332 256 332 Q 260 332 280 352 Q 300 372 290 402 Q 280 432 256 452 Z" 
          fill="url(#leafGreen)" opacity="0.9"/>
    <path d="M 256 432 L 256 352" stroke="#2E7D32" stroke-width="2" opacity="0.6"/>
    
    <!-- 底部左侧叶 -->
    <path d="M 180 432 Q 200 422 210 397 Q 220 372 205 357 Q 190 342 180 347 Q 170 352 165 377 Q 160 402 180 432 Z" 
          fill="url(#leafDarkGreen)" opacity="0.85"/>
    <path d="M 180 417 L 185 357" stroke="#1B5E20" stroke-width="1.5" opacity="0.5"/>
    
    <!-- 底部右侧叶 -->
    <path d="M 332 432 Q 312 422 302 397 Q 292 372 307 357 Q 322 342 332 347 Q 342 352 347 377 Q 352 402 332 432 Z" 
          fill="url(#leafDarkGreen)" opacity="0.85"/>
    <path d="M 332 417 L 327 357" stroke="#1B5E20" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- 立体白字 - 微软雅黑/黑体 -->
  <text x="256" y="355" 
        font-family="Microsoft YaHei, SimHei, Heiti SC, sans-serif" 
        font-size="400" 
        font-weight="bold" 
        fill="rgba(255,255,255,0.98)" 
        text-anchor="middle" 
        filter="url(#text3D)">白</text>
  
  <!-- 文字外描边 -->
  <text x="256" y="355" 
        font-family="Microsoft YaHei, SimHei, Heiti SC, sans-serif" 
        font-size="400" 
        font-weight="bold" 
        fill="none" 
        stroke="rgba(255,255,255,0.4)" 
        stroke-width="2"
        text-anchor="middle">白</text>
</svg>
