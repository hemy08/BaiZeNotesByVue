<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020617"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.9"/>
      <stop offset="40%" style="stop-color:#00E0FF;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#6C5CE7;stop-opacity:0"/>
    </radialGradient>
    <filter id="neon"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg2)"/>
  <!-- 三个数据弧（象征多源知识整合）- 放大30%并上移 -->
  <path d="M154.8 154.8 A 208 208 0 0 1 357.2 154.8" fill="none" stroke="#00E0FF" stroke-width="10.4" stroke-linecap="round" filter="url(#neon)"/>
  <path d="M76.4 236 A 260 260 0 0 0 435.6 236" fill="none" stroke="#6C5CE7" stroke-width="10.4" stroke-linecap="round" filter="url(#neon)"/>
  <path d="M180.4 317.2 A 182 182 0 0 0 331.6 317.2" fill="none" stroke="#00E0FF" stroke-width="6.5" stroke-linecap="round" opacity="0.7"/>
  <!-- 中心能量核 - 放大30%并上移 -->
  <circle cx="256" cy="236" r="130" fill="url(#core)"/>
  <circle cx="256" cy="236" r="31.2" fill="#FFFFFF" filter="url(#neon)"/>
  <!-- 品牌文字 -->
  <text x="256" y="460" font-family="'Inter','Segoe UI',sans-serif" font-size="34" font-weight="600" fill="#E2E8F0" text-anchor="middle" letter-spacing="8">白泽笔记</text>
  <text x="256" y="490" font-family="monospace" font-size="14" fill="#00E0FF" text-anchor="middle" letter-spacing="4">BAIZE NOTES</text>
</svg>
