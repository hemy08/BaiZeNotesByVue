<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 深蓝色星空背景渐变 -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1929;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a237e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#283593;stop-opacity:1" />
    </linearGradient>
    
    <!-- 金色渐变 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA000;stop-opacity:1" />
    </linearGradient>
    
    <!-- 绿色树叶渐变 -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    
    <!-- 发光效果 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 阴影效果 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- 圆角背景 - 星空 -->
  <rect width="512" height="512" rx="100" fill="url(#skyGrad)"/>
  
  <!-- 星星装饰 - 简约风格 -->
  <g fill="white" opacity="0.8">
    <!-- 大星星 -->
    <circle cx="100" cy="100" r="3"/>
    <circle cx="412" cy="100" r="3"/>
    <circle cx="100" cy="412" r="3"/>
    <circle cx="412" cy="412" r="3"/>
    
    <!-- 中等星星 -->
    <circle cx="150" cy="180" r="2"/>
    <circle cx="362" cy="180" r="2"/>
    <circle cx="150" cy="332" r="2"/>
    <circle cx="362" cy="332" r="2"/>
    
    <!-- 小星星 -->
    <circle cx="200" cy="120" r="1.5"/>
    <circle cx="312" cy="120" r="1.5"/>
    <circle cx="200" cy="392" r="1.5"/>
    <circle cx="312" cy="392" r="1.5"/>
    <circle cx="120" cy="256" r="1.5"/>
    <circle cx="392" cy="256" r="1.5"/>
  </g>
  
  <!-- 树叶装饰 - 四角简约设计 -->
  <g filter="url(#shadow)">
    <!-- 左上角树叶 -->
    <path d="M 80 80 Q 100 60 120 70 Q 140 80 135 100 Q 130 120 110 125 Q 90 130 80 110 Q 70 90 80 80 Z" 
          fill="url(#leafGrad)" opacity="0.9"/>
    <path d="M 95 85 L 115 115" stroke="#1B5E20" stroke-width="2" opacity="0.6"/>
    
    <!-- 右上角树叶 -->
    <path d="M 432 80 Q 412 60 392 70 Q 372 80 377 100 Q 382 120 402 125 Q 422 130 432 110 Q 442 90 432 80 Z" 
          fill="url(#leafGrad)" opacity="0.9"/>
    <path d="M 417 85 L 397 115" stroke="#1B5E20" stroke-width="2" opacity="0.6"/>
    
    <!-- 左下角树叶 -->
    <path d="M 80 432 Q 100 452 120 442 Q 140 432 135 412 Q 130 392 110 387 Q 90 382 80 402 Q 70 422 80 432 Z" 
          fill="url(#leafGrad)" opacity="0.9"/>
    <path d="M 95 427 L 115 397" stroke="#1B5E20" stroke-width="2" opacity="0.6"/>
    
    <!-- 右下角树叶 -->
    <path d="M 432 432 Q 412 452 392 442 Q 372 432 377 412 Q 382 392 402 387 Q 422 382 432 402 Q 442 422 432 432 Z" 
          fill="url(#leafGrad)" opacity="0.9"/>
    <path d="M 417 427 L 397 397" stroke="#1B5E20" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- 白泽神兽简约图标 - 金色 -->
  <g filter="url(#glow)" transform="translate(256, 256)">
    <!-- 神兽身体 - 简约圆形 -->
    <circle cx="0" cy="20" r="80" fill="url(#goldGrad)" opacity="0.95"/>
    
    <!-- 神兽头部 -->
    <circle cx="0" cy="-40" r="50" fill="url(#goldGrad)" opacity="0.95"/>
    
    <!-- 神兽角 - 两只 -->
    <path d="M -30 -70 Q -35 -100 -25 -110 Q -15 -100 -20 -70" 
          fill="url(#goldGrad)" stroke="#FFA000" stroke-width="2"/>
    <path d="M 30 -70 Q 35 -100 25 -110 Q 15 -100 20 -70" 
          fill="url(#goldGrad)" stroke="#FFA000" stroke-width="2"/>
    
    <!-- 神兽眼睛 - 简约圆点 -->
    <circle cx="-15" cy="-45" r="6" fill="#0a1929"/>
    <circle cx="15" cy="-45" r="6" fill="#0a1929"/>
    
    <!-- 神兽胡须 - 简约线条 -->
    <line x1="-25" y1="-30" x2="-45" y2="-25" stroke="#FFA000" stroke-width="2" stroke-linecap="round"/>
    <line x1="25" y1="-30" x2="45" y2="-25" stroke="#FFA000" stroke-width="2" stroke-linecap="round"/>
    
    <!-- 神兽身体纹理 - 简约云纹 -->
    <path d="M -40 20 Q -30 10 -20 20 Q -10 30 0 20 Q 10 10 20 20 Q 30 30 40 20" 
          fill="none" stroke="#FFA000" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>
  
  <!-- 文字 "白泽" - 简约风格 -->
  <text x="256" y="460" 
        font-family="Microsoft YaHei, SimHei, sans-serif" 
        font-size="48" 
        font-weight="bold" 
        fill="white" 
        text-anchor="middle"
        opacity="0.9">白泽笔记</text>
</svg>
