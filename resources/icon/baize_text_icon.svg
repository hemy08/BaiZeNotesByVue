<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 渐变背景 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    
    <!-- 文字渐变 -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffed4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:1" />
    </linearGradient>
    
    <!-- 阴影效果 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    
    <!-- 文字阴影 -->
    <filter id="textShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    
    <!-- 发光效果 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- 装饰花边 - 外圈 -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="rgba(255,215,0,0.3)" stroke-width="3" stroke-dasharray="20,10"/>
  
  <!-- 装饰花边 - 中圈 -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,215,0,0.2)" stroke-width="2" stroke-dasharray="15,8"/>
  
  <!-- 装饰花边 - 内圈 -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,215,0,0.15)" stroke-width="1.5" stroke-dasharray="10,5"/>
  
  <!-- 角落装饰 -->
  <g opacity="0.4">
    <!-- 左上角 -->
    <path d="M 80 80 Q 120 80 120 120" fill="none" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
    <path d="M 80 80 Q 80 120 120 120" fill="none" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
    <circle cx="80" cy="80" r="5" fill="#ffd700"/>
    
    <!-- 右上角 -->
    <path d="M 432 80 Q 392 80 392 120" fill="none" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
    <path d="M 432 80 Q 432 120 392 120" fill="none" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
    <circle cx="432" cy="80" r="5" fill="#ffd700"/>
    
    <!-- 左下角 -->
    <path d="M 80 432 Q 120 432 120 392" fill="none" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
    <path d="M 80 432 Q 80 392 120 392" fill="none" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
    <circle cx="80" cy="432" r="5" fill="#ffd700"/>
    
    <!-- 右下角 -->
    <path d="M 432 432 Q 392 432 392 392" fill="none" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
    <path d="M 432 432 Q 432 392 392 392" fill="none" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
    <circle cx="432" cy="432" r="5" fill="#ffd700"/>
  </g>
  
  <!-- 白泽文字 - 主标题 -->
  <text x="256" y="290" 
        font-family="KaiTi, SimSun, STKaiti, serif" 
        font-size="200" 
        font-weight="bold" 
        fill="url(#textGrad)" 
        text-anchor="middle"
        filter="url(#textShadow)"
        style="letter-spacing: 20px">白泽</text>
  
  <!-- 白泽文字 - 发光层 -->
  <text x="256" y="290" 
        font-family="KaiTi, SimSun, STKaiti, serif" 
        font-size="200" 
        font-weight="bold" 
        fill="none"
        stroke="rgba(255,215,0,0.5)"
        stroke-width="2"
        text-anchor="middle"
        filter="url(#glow)"
        style="letter-spacing: 20px">白泽</text>
  
  <!-- 副标题 -->
  <text x="256" y="380" 
        font-family="Arial, sans-serif" 
        font-size="40" 
        font-weight="normal" 
        fill="rgba(255,255,255,0.8)" 
        text-anchor="middle"
        style="text-shadow: 0 2px 4px rgba(0,0,0,0.3)">BAIZE</text>
  
  <!-- 装饰线条 -->
  <line x1="150" y1="320" x2="362" y2="320" stroke="rgba(255,215,0,0.4)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 祥云装饰 -->
  <g opacity="0.25">
    <!-- 左侧祥云 -->
    <circle cx="100" cy="200" r="25" fill="#fff"/>
    <circle cx="75" cy="210" r="20" fill="#fff"/>
    <circle cx="55" cy="200" r="22" fill="#fff"/>
    
    <!-- 右侧祥云 -->
    <circle cx="412" cy="200" r="25" fill="#fff"/>
    <circle cx="437" cy="210" r="20" fill="#fff"/>
    <circle cx="457" cy="200" r="22" fill="#fff"/>
  </g>
</svg>
