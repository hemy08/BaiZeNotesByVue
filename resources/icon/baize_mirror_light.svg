<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg_light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F1F5F9"/>
    </linearGradient>
    <linearGradient id="accent_light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <filter id="shadow_light">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#475569" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg_light)"/>
  <!-- 抽象透镜（科技洞察）- 浅色版本 - 放大30%并上移 -->
  <path d="M256 69.6 L422.4 236 L256 402.4 L89.6 236 Z" fill="none" stroke="url(#accent_light)" stroke-width="15.6" stroke-linejoin="round" filter="url(#shadow_light)"/>
  <!-- 内核数据点 - 放大30%并上移 -->
  <circle cx="256" cy="236" r="20.8" fill="#0EA5E9" filter="url(#shadow_light)"/>
  <circle cx="256" cy="236" r="7.8" fill="#FFFFFF"/>
  <!-- 数据轨迹环 - 放大30%并上移 -->
  <ellipse cx="256" cy="236" rx="182" ry="65" fill="none" stroke="#8B5CF6" stroke-width="3.9" stroke-dasharray="10.4 15.6" opacity="0.7" transform="rotate(45 256 236)"/>
  <!-- 品牌字 -->
  <text x="256" y="460" font-family="'Inter','Segoe UI',sans-serif" font-size="36" font-weight="700" fill="#1E293B" text-anchor="middle" letter-spacing="10">白泽笔记</text>
  <text x="256" y="492" font-family="'Inter','Segoe UI',sans-serif" font-size="14" font-weight="300" fill="#0EA5E9" text-anchor="middle" letter-spacing="6">BAIZE NOTES</text>
</svg>
