<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg2_light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFC"/>
      <stop offset="100%" style="stop-color:#E2E8F0"/>
    </linearGradient>
    <radialGradient id="core_light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#0EA5E9;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0"/>
    </radialGradient>
    <filter id="shadow_light"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748B" flood-opacity="0.2"/></filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg2_light)"/>
  <!-- 三个数据弧（象征多源知识整合）- 浅色版本 - 放大30%并上移 -->
  <path d="M154.8 154.8 A 208 208 0 0 1 357.2 154.8" fill="none" stroke="#0EA5E9" stroke-width="10.4" stroke-linecap="round" filter="url(#shadow_light)"/>
  <path d="M76.4 236 A 260 260 0 0 0 435.6 236" fill="none" stroke="#8B5CF6" stroke-width="10.4" stroke-linecap="round" filter="url(#shadow_light)"/>
  <path d="M180.4 317.2 A 182 182 0 0 0 331.6 317.2" fill="none" stroke="#0EA5E9" stroke-width="6.5" stroke-linecap="round" opacity="0.8"/>
  <!-- 中心能量核 - 放大30%并上移 -->
  <circle cx="256" cy="236" r="130" fill="url(#core_light)"/>
  <circle cx="256" cy="236" r="31.2" fill="#0EA5E9" filter="url(#shadow_light)"/>
  <circle cx="256" cy="236" r="15.6" fill="#FFFFFF"/>
  <!-- 品牌文字 -->
  <text x="256" y="460" font-family="'Inter','Segoe UI',sans-serif" font-size="34" font-weight="600" fill="#1E293B" text-anchor="middle" letter-spacing="8">白泽笔记</text>
  <text x="256" y="490" font-family="monospace" font-size="14" fill="#0EA5E9" text-anchor="middle" letter-spacing="4">BAIZE NOTES</text>
</svg>
