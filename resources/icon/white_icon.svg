<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 渐变背景 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    
    <!-- 花边渐变 - 金色 -->
    <linearGradient id="borderGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    
    <!-- 花边渐变 - 银色 -->
    <linearGradient id="borderSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C0C0C0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8E8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0C0C0;stop-opacity:1" />
    </linearGradient>
    
    <!-- 花边渐变 - 铜色 -->
    <linearGradient id="borderBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CD7F32;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#DAA520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CD7F32;stop-opacity:1" />
    </linearGradient>
    
    <!-- 阴影效果 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    
    <!-- 超强立体文字阴影 -->
    <filter id="text3D" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="1" dy="1" stdDeviation="0" flood-color="#000" flood-opacity="0.7"/>
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#000" flood-opacity="0.6"/>
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000" flood-opacity="0.5"/>
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000" flood-opacity="0.4"/>
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000" flood-opacity="0.3"/>
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#000" flood-opacity="0.2"/>
      <feDropShadow dx="7" dy="7" stdDeviation="1" flood-color="#000" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#fff" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- 清晰花边 - 第1圈(最外圈) - 金色 -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#borderGold)" stroke-width="12"/>
  <circle cx="256" cy="256" r="234" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.6"/>
  
  <!-- 清晰花边 - 第2圈 - 银色 -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#borderSilver)" stroke-width="10"/>
  <circle cx="256" cy="256" r="213" fill="none" stroke="#E8E8E8" stroke-width="2" opacity="0.6"/>
  
  <!-- 清晰花边 - 第3圈 - 铜色 -->
  <circle cx="256" cy="256" r="198" fill="none" stroke="url(#borderBronze)" stroke-width="8"/>
  <circle cx="256" cy="256" r="194" fill="none" stroke="#DAA520" stroke-width="2" opacity="0.6"/>
  
  <!-- 清晰花边 - 第4圈 - 金色 -->
  <circle cx="256" cy="256" r="178" fill="none" stroke="url(#borderGold)" stroke-width="6"/>
  <circle cx="256" cy="256" r="175" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.6"/>
  
  <!-- 清晰花边 - 第5圈 - 银色 -->
  <circle cx="256" cy="256" r="158" fill="none" stroke="url(#borderSilver)" stroke-width="4"/>
  <circle cx="256" cy="256" r="156" fill="none" stroke="#E8E8E8" stroke-width="1" opacity="0.6"/>
  
  <!-- 装饰性虚线圆环 -->
  <circle cx="256" cy="256" r="228" fill="none" stroke="white" stroke-width="2" stroke-dasharray="20,10" opacity="0.4"/>
  <circle cx="256" cy="256" r="208" fill="none" stroke="white" stroke-width="2" stroke-dasharray="15,8" opacity="0.35"/>
  <circle cx="256" cy="256" r="188" fill="none" stroke="white" stroke-width="2" stroke-dasharray="12,6" opacity="0.3"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="white" stroke-width="1" stroke-dasharray="10,5" opacity="0.25"/>
  
  <!-- 装饰性星星 -->
  <g opacity="0.7">
    <polygon points="256,30 261,45 276,45 264,55 269,70 256,60 243,70 248,55 236,45 251,45" fill="#FFD700"/>
    <polygon points="30,256 45,261 45,276 55,264 70,269 60,256 70,243 55,248 45,236 45,251" fill="#FFD700"/>
    <polygon points="482,256 467,251 467,236 457,248 442,243 452,256 442,269 457,264 467,276 467,261" fill="#FFD700"/>
    <polygon points="256,482 251,467 236,467 248,457 243,442 256,452 269,442 264,457 276,467 261,467" fill="#FFD700"/>
  </g>
  
  <!-- 装饰性圆点 -->
  <g opacity="0.6">
    <circle cx="100" cy="100" r="10" fill="#FFD700"/>
    <circle cx="412" cy="100" r="10" fill="#FFD700"/>
    <circle cx="100" cy="412" r="10" fill="#FFD700"/>
    <circle cx="412" cy="412" r="10" fill="#FFD700"/>
    
    <circle cx="156" cy="156" r="6" fill="#C0C0C0"/>
    <circle cx="356" cy="156" r="6" fill="#C0C0C0"/>
    <circle cx="156" cy="356" r="6" fill="#C0C0C0"/>
    <circle cx="356" cy="356" r="6" fill="#C0C0C0"/>
  </g>
  
  <!-- 超立体的大白字 -->
  <text x="256" y="350" 
        font-family="KaiTi, SimSun, STKaiti, serif" 
        font-size="400" 
        font-weight="bold" 
        fill="rgba(255,255,255,0.98)" 
        text-anchor="middle" 
        filter="url(#text3D)">白</text>
  
  <!-- 文字外描边 -->
  <text x="256" y="350" 
        font-family="KaiTi, SimSun, STKaiti, serif" 
        font-size="400" 
        font-weight="bold" 
        fill="none" 
        stroke="rgba(255,255,255,0.5)" 
        stroke-width="2.5"
        text-anchor="middle">白</text>
</svg>
