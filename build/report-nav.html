<script>
  ;(function () {
    // 当前页高亮 + 所属分类展开 + 顶部显示当前报告名
    var norm = function (p) {
      try {
        return decodeURIComponent(p).replace(/\\/g, '/').replace(/\/+$/, '')
      } catch (e) {
        return p
      }
    }
    var self = norm(location.pathname)
    var links = document.querySelectorAll('.rgnav a[href$=".html"]')
    var current = null
    for (var i = 0; i < links.length; i++) {
      var a = links[i]
      if (norm(new URL(a.href, location.href).pathname) === self) {
        a.classList.add('active')
        current = a
      }
    }
    if (current) {
      var box = current.closest('details')
      if (box) box.setAttribute('open', '')
      var label = document.getElementById('rgnav-current')
      if (label) {
        label.textContent = current.textContent.trim()
        label.setAttribute('href', current.getAttribute('href'))
      }
    } else {
      var home = document.querySelector('.rgnav .rgnav-home')
      if (home && norm(new URL(home.href, location.href).pathname) === self) {
        home.classList.add('active')
      }
      var label2 = document.getElementById('rgnav-current')
      if (label2) label2.textContent = document.title.replace(' · 报告', '')
    }
    // 点击页面空白处收起下拉
    document.addEventListener('click', function (e) {
      var within = e.target.closest && e.target.closest('.rgnav details')
      var all = document.querySelectorAll('.rgnav details[open]')
      for (var j = 0; j < all.length; j++) {
        if (all[j] !== within) all[j].removeAttribute('open')
      }
    })
  })()
</script>
