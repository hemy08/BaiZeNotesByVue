name: CI

# 2026-11-18（遗留清单 #16）：最小质量门禁流水线
# - 与本地门禁一致：typecheck（node/web/test 三段）→ ESLint → Vitest
# - 平台选用 windows-latest：仓库为 Windows 桌面应用，路径/编码相关用例与本地环境一致
# - quality-gate 不执行打包；e2e job 仅执行 electron-builder --dir 解包产物（不做安装包签名/发布），
#   安装包发布流水线另行配置
#
# 2026-11-19（P3 遗留项：E2E 未纳入 CI）：新增独立 `e2e` job（与 quality-gate 并行）
# - 真实 Electron 冒烟：electron-vite build → Playwright `_electron.launch`（e2e/smoke.spec.ts）
# - 使用 @playwright/test 直接驱动 Electron 二进制，无需 `npx playwright install`
#   下载浏览器（Electron 二进制由 npm ci 的 electron postinstall 下载）
# - e2e 与 quality-gate 相互独立：任一失败都会在 PR 检查中单独可见，不改变原门禁结构
#
# 2026-11-19（P0 E2E 补齐）：e2e job 扩展为「开发构建 + 打包产物」双层验证
# - 构建改为 `npm run build:unpack`：一次产出 out/build/{main,preload,renderer} 与
#   out/build/dist/win-unpacked（electron-builder --dir），后者供打包启动用例验证 asar/单文件 preload；
# - 用例新增：启动恢复（autoOpenLastFile/Folder）、系统设置保存跨重启持久化、打包产物直接启动；
# - 用例每个使用临时 home/userData 并清理（打包版见 e2e/packaged-launch.spec.ts 的备份/恢复策略）；
# - e2e job 超时 25 → 45 分钟（含一次 electron-builder --dir 打包）；
# - quality-gate 的 coverage 步骤后新增 coverage-report artifact 上传（retention 7 天）。
#
# 2026-11-19（P0 安装包瘦身 + CI 体积预算）：新增独立 `bundle-budget` job（与 quality-gate/e2e 并行）
# - 体积预算断言的是真实安装包产物（NSIS/portable/asar），不能只跑 electron-vite build，
#   因此该 job 先执行完整 `npm run build:win:all`，再运行 `npm run budget:check`
#   （阈值与断言逻辑见 build/check-bundle-budget.js，基线数据见 out/tool-results/p0-size.md）
# - 与 e2e job 的 build:unpack 相互独立（各自 runner，不共享工作区）
#
# 2026-11-20（发布/CI 门禁修复批次）：
# - 显式最小权限（contents: read），不再继承仓库默认 token 权限；
# - 全量测试只跑一次：`vitest run --coverage` 同时产出覆盖率（阈值仍生效）与 JSON 报告，
#   JSON 供 quality baseline 校验用例数（此前 quality:check 未传 --test-json，用例数漂移无法拦截）；
# - coverage artifact 改为 `if: always()`（覆盖率阈值失败时也要留下现场）；
# - ESLint 加 `--max-warnings=0`（no-explicit-any 等 warn 不再可长期累积）；
# - 三个 job 增加 Electron 二进制下载缓存（npm ci 各自下载 ≈100MB+）；
# - e2e 类型检查已纳入 `npm run typecheck`（tsconfig.e2e.json），无需单独步骤。
#
# 2026-11-20（P1-4：E2E 自动恢复掩盖启动稳定性）：
# - Playwright `retries` 由 1 调整为 0（playwright.config.ts）：重试会把「启动靠自动恢复/
#   重跑才通过」洗成绿色，真实恢复率不可观测；取舍见配置注释与 fix-e2e3 报告；
# - `e2e` job 保持容错：功能用例经 helpers/app-ui.ts 的 recordStartupMetrics() 把
#   launchAttempts / reloadRecoveries 写入 annotation + CI 日志（console），功能测试不因
#   已知 Electron 43.x 上游 preload 竞态变红；用 --grep-invert 排除量化用例
#   （tag `@startup-stability`），避免重复执行；
# - 新增独立 `e2e-startup-stability` job：严格模式 E2E_STRICT_LAUNCH=1 + retries=0，
#   先跑零恢复基线功能用例（tag `@zero-recovery-baseline`，自带 3 次有界重试，
#   命中已知竞态不会误红），再跑启动稳定性量化 spec（软门禁：恢复率告警线 ≤25%、
#   阻断线 ≤75%，且零进程重启；阈值校准依据见 spec 头部注释与 fix-e2e3 报告）；
#   该 job 只需开发构建（不打包），因此单独跑 electron-vite build 而不是 build:unpack。
#
# 2026-11-20（性能基线纳入 CI，scan-perf「基线只记录、不防回归」）：
# - 新增独立 `perf-baseline` job（与 quality-gate / e2e / bundle-budget 并行）：
#   `build:unpack` 后运行 `npm run perf:ci:startup`——采集 bundle 指标（首屏/入口/壳/预览/
#   主进程/preload/asar/解包/locales/安装包）并触发开发构建 + 打包版各 1 次冷启动采样
#   （performance marks + 外部窗口可见探测），与仓库内基线快照
#   `build/perf-baseline.snapshot.json` 对比；
# - 软门禁：偏离基线 >20% 只输出 warning annotation（::warning）并写 JSON/Markdown artifact，
#   job 级 `continue-on-error: true`，任何回归都不阻塞 PR；采集逻辑与阈值依据见
#   build/perf-ci.js 头部注释、README「性能基线 CI（软门禁）」；
# - 与 bundle-budget 分工：后者是体积硬门禁；本 job 记录性能趋势并做回归提示；
# - 与 e2e-startup-stability 分工：后者测启动链恢复率/零进程重启（稳定性），本 job 测启动耗时基线。
on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality-gate:
        name: Typecheck / Lint / Test
        runs-on: windows-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # 可选优化：缓存 Electron 二进制（npm ci 的 electron postinstall 下载 ≈100MB+）
            - name: Cache Electron binary
              uses: actions/cache@v4
              with:
                  path: |
                      ~/AppData/Local/electron/Cache
                      ~/AppData/Local/electron-builder/Cache
                  key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Typecheck (node / web / test / e2e)
              run: npm run typecheck

            # Q-17：warn 也纳入门禁，避免 warning 长期累积（当前实测 0 warning）
            - name: ESLint
              run: npx --no-install eslint . --max-warnings=0

            # Q-16：测试只跑一次——覆盖率阈值 + 默认控制台报告 + JSON 报告（供用例数基线校验）
            - name: Vitest with coverage (+ JSON report)
              run: npx --no-install vitest run --coverage --reporter=default --reporter=json --outputFile.json=out/test-results/vitest.json

            # P0 E2E 补齐：coverage 结果作为 artifact 留存（7 天），便于质量趋势/失败排查
            # Q-16：覆盖率阈值失败（步骤红）时也要上传现场证据，故用 if: always()
            - name: Upload coverage artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: coverage/
                  retention-days: 7

            - name: Prettier check
              run: npx --no-install prettier --check .

            # P2-5（2026-11-20 安全扫描）：审计口径由「仅生产依赖」升级为「全量依赖树（含 dev）」。
            # 背景：dompurify / mermaid / katex / highlight.js / crypto-js / markdown-it-* 等实际
            # 随 renderer bundle 分发到用户机器的运行时安全库位于 devDependencies
            # （Vite 内联，避免 electron-builder 把 node_modules 重复打进 asar），
            # 原 `--omit=dev` 门禁漏审这些库。现统一走 package.json 的 audit:all
            # （全量树 + --audit-level=high + 官方 registry，本地 `npm run audit:all` 可复现）；
            # 生产专项审计保留为 `npm run audit:prod`，供本地快速核对主进程 externalize 依赖。
            # 依赖分类策略与冻结 allowlist 由 tests/architecture/dependency-classification.test.ts 守护。
            - name: Dependency audit (full tree, incl. bundled renderer libs)
              run: npm run audit:all

            # Q-10：传入 vitest JSON 报告，用例数（numTotalTests）漂移也会被基线门禁拦截
            - name: Quality baseline check
              run: node build/generate-quality-baseline.js --check --test-json=out/test-results/vitest.json

            # P1 文档链接检查：扫描 docs/**/*.md 相对链接（忽略外链/锚点/代码块），断链即失败
            - name: Docs link check
              run: npm run docs:check

    e2e:
        name: E2E (Playwright + Electron)
        runs-on: windows-latest
        # P0 E2E 补齐：e2e 现在同时覆盖开发构建与打包产物（npm run build:unpack 含
        # electron-vite build + electron-builder --dir），耗时从纯构建的 ~5min 提升到 ~10min，
        # 25 → 45 分钟留足冷启动/重试余量
        timeout-minutes: 45
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # 可选优化：缓存 Electron 二进制（npm ci 的 electron postinstall 下载 ≈100MB+）
            - name: Cache Electron binary
              uses: actions/cache@v4
              with:
                  path: |
                      ~/AppData/Local/electron/Cache
                      ~/AppData/Local/electron-builder/Cache
                  key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # P0 E2E 补齐：一步产出全部 E2E 依赖的产物
            # - out/build/main|preload|renderer：开发构建用例（冒烟/启动恢复/设置持久化）
            # - out/build/dist/win-unpacked：打包启动用例（asar / extraResources / 单文件 preload 真实链路）
            # 与本地构建命令一致（build:unpack = generate-version + generate-preload-whitelist +
            # electron-vite build + prepare-build-dirs + electron-builder --dir）
            - name: Build dev + unpacked app
              run: npm run build:unpack

            # P1-4：功能 E2E 保持容错模式（E2E_STRICT_LAUNCH=0）并输出启动指标；
            # 量化用例由独立 e2e-startup-stability job 执行（避免重复启动 Electron 采样）。
            - name: Run Playwright E2E (functional, tolerant startup metrics)
              env:
                  E2E_STRICT_LAUNCH: '0'
              run: npx --no-install playwright test --grep-invert "@startup-stability"

            - name: Upload Playwright report on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7

    # P1-4：启动链稳定性独立量化（与功能 E2E 分离，避免自动恢复掩盖启动退化）
    # - 严格模式（E2E_STRICT_LAUNCH=1）：功能用例零恢复硬失败；量化 spec 逐样本零进程重启
    # - retries=0：量化必须单次运行，重试会抹平真实恢复率
    # - 软门禁：N 次连续启动的恢复率告警线 25% / 阻断线 75%，且零进程重启
    #   （阈值校准依据见 e2e/startup-stability.spec.ts 头部注释与 fix-e2e3 报告）
    e2e-startup-stability:
        name: E2E startup stability (strict metrics)
        runs-on: windows-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Cache Electron binary
              uses: actions/cache@v4
              with:
                  path: |
                      ~/AppData/Local/electron/Cache
                      ~/AppData/Local/electron-builder/Cache
                  key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # 只需开发构建（out/build/main|preload|renderer），不需要 electron-builder 打包：
            # 与 build:unpack 的前三步一致（版本/白名单生成 + electron-vite build）
            - name: Build dev artifacts
              run: npm run generate-version && npm run generate-preload-whitelist && npx --no-install electron-vite build

            # 严格模式功能基线：零恢复启动路径必须存在（该用例自带最多 3 次有界重试，
            # 单次命中已知 Electron 上游竞态不会误红，最终仍硬断言首启零恢复）
            - name: Strict zero-recovery baseline (functional)
              env:
                  E2E_STRICT_LAUNCH: '1'
              run: npx --no-install playwright test --grep "@zero-recovery-baseline" --retries=0

            # 量化门禁：连续启动 N 次统计恢复率；retries=0 保证统计真实性
            - name: Startup stability metrics (soft gate)
              env:
                  E2E_STRICT_LAUNCH: '1'
                  E2E_STARTUP_SAMPLES: '8'
              run: npx --no-install playwright test --grep "@startup-stability" --retries=0

            - name: Upload Playwright report on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report-startup-stability
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7

    bundle-budget:
        name: Bundle budget (packaged size)
        runs-on: windows-latest
        timeout-minutes: 40
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # 可选优化：缓存 Electron 二进制（npm ci 的 electron postinstall 下载 ≈100MB+）
            - name: Cache Electron binary
              uses: actions/cache@v4
              with:
                  path: |
                      ~/AppData/Local/electron/Cache
                      ~/AppData/Local/electron-builder/Cache
                  key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # P0 体积预算检查对象是真实安装包 / app.asar（不是源码体积），必须先完整打包：
            # electron-vite build ×1 + electron-builder ×2（NSIS + portable）
            - name: Build Windows artifacts (NSIS + portable)
              run: npm run build:win:all

            - name: Check bundle budget
              run: npm run budget:check

    # 性能基线软门禁（2026-11-20：scan-perf P1「性能基线只记录、不能防回归」）
    # - 构建后采集 bundle 指标 + 冷启动采样，与仓库内基线快照 build/perf-baseline.snapshot.json 对比；
    # - 偏离 >20% 只输出 warning annotation + 报告 artifact，不 fail（job continue-on-error）；
    # - 与 bundle-budget（体积硬门禁）/ e2e-startup-stability（启动链稳定性）职责互补。
    perf-baseline:
        name: Performance baseline (soft gate)
        runs-on: windows-latest
        timeout-minutes: 40
        # 软门禁：任何失败/告警都不阻塞 PR；回归信息通过 warning annotation 与 artifact 呈现
        continue-on-error: true
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Cache Electron binary
              uses: actions/cache@v4
              with:
                  path: |
                      ~/AppData/Local/electron/Cache
                      ~/AppData/Local/electron-builder/Cache
                  key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # 一次构建同时提供：out/build/{main,preload,renderer}（开发构建冷启动）
            # 与 out/build/dist/win-unpacked（打包版冷启动 + asar/locales/unpacked 指标）
            - name: Build dev + unpacked app
              run: npm run build:unpack

            # bundle 指标 + 开发构建 / 打包版各 1 次冷启动采样；指标偏离只 warning。
            # 采样失败时脚本内部降级为 warning 并继续输出 bundle 报告，不改变退出码。
            - name: Collect perf baseline (bundle + startup, warn-only)
              run: npm run perf:ci:startup

            # 报告作为 artifact 留存（含 JSON / Markdown / 冷启动原始报告），失败也上传现场
            - name: Upload perf baseline artifacts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: perf-baseline
                  path: |
                      out/analysis/perf-baseline-ci.json
                      out/analysis/perf-baseline-ci.md
                      out/analysis/perf-baseline.json
                      out/analysis/perf-baseline-packaged.json
                  retention-days: 14
