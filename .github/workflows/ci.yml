name: CI

# 2026-11-18（遗留清单 #16）：最小质量门禁流水线
# - 与本地门禁一致：typecheck（node/web/test 三段）→ ESLint → Vitest
# - 平台选用 windows-latest：仓库为 Windows 桌面应用，路径/编码相关用例与本地环境一致
# - quality-gate 不执行打包；e2e job 仅执行 electron-builder --dir 解包产物（不做安装包签名/发布），
#   安装包发布流水线另行配置
#
# 2026-11-19（P3 遗留项：E2E 未纳入 CI）：新增独立 `e2e` job（与 quality-gate 并行）
# - 真实 Electron 冒烟：electron-vite build → Playwright `_electron.launch`（e2e/smoke.spec.ts）
# - 使用 @playwright/test 直接驱动 Electron 二进制，无需 `npx playwright install`
#   下载浏览器（Electron 二进制由 npm ci 的 electron postinstall 下载）
# - e2e 与 quality-gate 相互独立：任一失败都会在 PR 检查中单独可见，不改变原门禁结构
#
# 2026-11-19（P0 E2E 补齐）：e2e job 扩展为「开发构建 + 打包产物」双层验证
# - 构建改为 `npm run build:unpack`：一次产出 out/build/{main,preload,renderer} 与
#   out/build/dist/win-unpacked（electron-builder --dir），后者供打包启动用例验证 asar/单文件 preload；
# - 用例新增：启动恢复（autoOpenLastFile/Folder）、系统设置保存跨重启持久化、打包产物直接启动；
# - 用例每个使用临时 home/userData 并清理（打包版见 e2e/packaged-launch.spec.ts 的备份/恢复策略）；
# - e2e job 超时 25 → 45 分钟（含一次 electron-builder --dir 打包）；
# - quality-gate 的 coverage 步骤后新增 coverage-report artifact 上传（retention 7 天）。
#
# 2026-11-19（P0 安装包瘦身 + CI 体积预算）：新增独立 `bundle-budget` job（与 quality-gate/e2e 并行）
# - 体积预算断言的是真实安装包产物（NSIS/portable/asar），不能只跑 electron-vite build，
#   因此该 job 先执行完整 `npm run build:win:all`，再运行 `npm run budget:check`
#   （阈值与断言逻辑见 build/check-bundle-budget.js，基线数据见 out/tool-results/p0-size.md）
# - 与 e2e job 的 build:unpack 相互独立（各自 runner，不共享工作区）
#
# 2026-11-20（发布/CI 门禁修复批次）：
# - 显式最小权限（contents: read），不再继承仓库默认 token 权限；
# - 全量测试只跑一次：`vitest run --coverage` 同时产出覆盖率（阈值仍生效）与 JSON 报告，
#   JSON 供 quality baseline 校验用例数（此前 quality:check 未传 --test-json，用例数漂移无法拦截）；
# - coverage artifact 改为 `if: always()`（覆盖率阈值失败时也要留下现场）；
# - ESLint 加 `--max-warnings=0`（no-explicit-any 等 warn 不再可长期累积）；
# - 三个 job 增加 Electron 二进制下载缓存（npm ci 各自下载 ≈100MB+）；
# - e2e 类型检查已纳入 `npm run typecheck`（tsconfig.e2e.json），无需单独步骤。
on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality-gate:
        name: Typecheck / Lint / Test
        runs-on: windows-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # 可选优化：缓存 Electron 二进制（npm ci 的 electron postinstall 下载 ≈100MB+）
            - name: Cache Electron binary
              uses: actions/cache@v4
              with:
                  path: |
                      ~/AppData/Local/electron/Cache
                      ~/AppData/Local/electron-builder/Cache
                  key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Typecheck (node / web / test / e2e)
              run: npm run typecheck

            # Q-17：warn 也纳入门禁，避免 warning 长期累积（当前实测 0 warning）
            - name: ESLint
              run: npx --no-install eslint . --max-warnings=0

            # Q-16：测试只跑一次——覆盖率阈值 + 默认控制台报告 + JSON 报告（供用例数基线校验）
            - name: Vitest with coverage (+ JSON report)
              run: npx --no-install vitest run --coverage --reporter=default --reporter=json --outputFile.json=out/test-results/vitest.json

            # P0 E2E 补齐：coverage 结果作为 artifact 留存（7 天），便于质量趋势/失败排查
            # Q-16：覆盖率阈值失败（步骤红）时也要上传现场证据，故用 if: always()
            - name: Upload coverage artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: coverage/
                  retention-days: 7

            - name: Prettier check
              run: npx --no-install prettier --check .

            - name: Production dependency audit
              run: npm audit --omit=dev --registry=https://registry.npmjs.org --audit-level=high

            # Q-10：传入 vitest JSON 报告，用例数（numTotalTests）漂移也会被基线门禁拦截
            - name: Quality baseline check
              run: node build/generate-quality-baseline.js --check --test-json=out/test-results/vitest.json

            # P1 文档链接检查：扫描 docs/**/*.md 相对链接（忽略外链/锚点/代码块），断链即失败
            - name: Docs link check
              run: npm run docs:check

    e2e:
        name: E2E (Playwright + Electron)
        runs-on: windows-latest
        # P0 E2E 补齐：e2e 现在同时覆盖开发构建与打包产物（npm run build:unpack 含
        # electron-vite build + electron-builder --dir），耗时从纯构建的 ~5min 提升到 ~10min，
        # 25 → 45 分钟留足冷启动/重试余量
        timeout-minutes: 45
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # 可选优化：缓存 Electron 二进制（npm ci 的 electron postinstall 下载 ≈100MB+）
            - name: Cache Electron binary
              uses: actions/cache@v4
              with:
                  path: |
                      ~/AppData/Local/electron/Cache
                      ~/AppData/Local/electron-builder/Cache
                  key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # P0 E2E 补齐：一步产出全部 E2E 依赖的产物
            # - out/build/main|preload|renderer：开发构建用例（冒烟/启动恢复/设置持久化）
            # - out/build/dist/win-unpacked：打包启动用例（asar / extraResources / 单文件 preload 真实链路）
            # 与本地构建命令一致（build:unpack = generate-version + generate-preload-whitelist +
            # electron-vite build + prepare-build-dirs + electron-builder --dir）
            - name: Build dev + unpacked app
              run: npm run build:unpack

            - name: Run Playwright E2E
              run: npx --no-install playwright test

            - name: Upload Playwright report on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7

    bundle-budget:
        name: Bundle budget (packaged size)
        runs-on: windows-latest
        timeout-minutes: 40
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # 可选优化：缓存 Electron 二进制（npm ci 的 electron postinstall 下载 ≈100MB+）
            - name: Cache Electron binary
              uses: actions/cache@v4
              with:
                  path: |
                      ~/AppData/Local/electron/Cache
                      ~/AppData/Local/electron-builder/Cache
                  key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # P0 体积预算检查对象是真实安装包 / app.asar（不是源码体积），必须先完整打包：
            # electron-vite build ×1 + electron-builder ×2（NSIS + portable）
            - name: Build Windows artifacts (NSIS + portable)
              run: npm run build:win:all

            - name: Check bundle budget
              run: npm run budget:check
