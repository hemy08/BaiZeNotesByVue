name: Release (tag → build → GitHub Release)

# 结构优化第 3 批 3.3：tag 触发的发布流水线（替代手工本地打包上传）。
# - 触发：推送 release-* tag（如 release-1.3.8）或手动 dispatch（输入 tag）
# - Windows 构建：npm run build:win:all（NSIS + portable），生成 latest.yml / blockmap
# - 上传到 GitHub Release：Setup exe、portable exe、blockmap、latest.yml
# - 发布后验证：releases/latest/download/latest.yml 可访问且版本与 tag 一致
on:
    push:
        tags:
            - 'release-*'
    workflow_dispatch:
        inputs:
            tag:
                description: '要发布的 tag（例如 release-1.3.8；需已存在）'
                required: true
                type: string

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        name: Windows Release
        runs-on: windows-latest
        timeout-minutes: 45
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Quality gate (typecheck + lint + tests)
              run: |
                  npm run typecheck
                  npx --no-install eslint . --quiet
                  npx --no-install vitest run

            - name: Build installers (NSIS + portable)
              run: npm run build:win:all

            - name: Verify artifacts
              shell: pwsh
              run: |
                  $version = node -e "process.stdout.write(require('./package.json').version)"
                  # M7 产物治理：electron-builder 输出目录为 out/build/dist（见 electron-builder.yml）
                  $distDir = 'out/build/dist'
                  $expected = @(
                    "$distDir/BaiZeNotes_Setup_$version`_windows_x64.exe",
                    "$distDir/BaiZeNotes_$version`_windows_x64.exe",
                    "$distDir/latest.yml"
                  )
                  foreach ($f in $expected) {
                    if (-not (Test-Path $f)) { throw "缺少发布产物：$f" }
                  }
                  $latest = Get-Content "$distDir/latest.yml" -Raw
                  if ($latest -notmatch "version: $version") { throw "latest.yml 版本不匹配（期望 $version）" }
                  Write-Host "产物校验通过：v$version"

            - name: Create GitHub Release and upload assets
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.event.inputs.tag || github.ref_name }}
                  name: ${{ github.event.inputs.tag || github.ref_name }}
                  generate_release_notes: true
                  files: |
                      out/build/dist/BaiZeNotes_Setup_*_windows_x64.exe
                      out/build/dist/BaiZeNotes_*_windows_x64.exe
                      out/build/dist/*.blockmap
                      out/build/dist/latest.yml
                  fail_on_unmatched_files: true

            - name: Verify update channel (latest.yml)
              shell: pwsh
              run: |
                  $version = node -e "process.stdout.write(require('./package.json').version)"
                  $url = 'https://github.com/hemy08/BaiZeNotesByVue/releases/latest/download/latest.yml'
                  $resp = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 60
                  if ($resp.StatusCode -ne 200) { throw "latest.yml 下载失败：$($resp.StatusCode)" }
                  if ($resp.Content -notmatch "version: $version") { throw "latest.yml 内容版本不匹配（期望 $version）" }
                  Write-Host "自动更新源验证通过：v$version"
