<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 渐变背景 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    
    <!-- 花边渐变 - 金色 -->
    <linearGradient id="borderGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    
    <!-- 阴影效果 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    
    <!-- 立体文字阴影 -->
    <filter id="text3D" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="1" dy="1" stdDeviation="0" flood-color="#000" flood-opacity="0.7"/>
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#000" flood-opacity="0.6"/>
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000" flood-opacity="0.5"/>
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000" flood-opacity="0.4"/>
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000" flood-opacity="0.3"/>
      <feDropShadow dx="6" dy="6" stdDeviation="1" flood-color="#000" flood-opacity="0.2"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#fff" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- 简洁花边 - 第1圈(外圈) - 金色 -->
  <circle cx="256" cy="256" r="235" fill="none" stroke="url(#borderGold)" stroke-width="8"/>
  
  <!-- 简洁花边 - 第2圈(内圈) - 金色虚线 -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#FFD700" stroke-width="3" stroke-dasharray="15,8" opacity="0.6"/>
  
  <!-- 简洁花边 - 第3圈(最内圈) - 白色虚线 -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="white" stroke-width="2" stroke-dasharray="10,5" opacity="0.3"/>
  
  <!-- 四角装饰星星 -->
  <g opacity="0.6">
    <polygon points="256,35 260,48 273,48 263,57 267,70 256,62 245,70 249,57 239,48 252,48" fill="#FFD700"/>
    <polygon points="35,256 48,260 48,273 57,263 70,267 62,256 70,245 57,249 48,239 48,252" fill="#FFD700"/>
    <polygon points="477,256 464,252 464,239 455,249 442,245 450,256 442,267 455,263 464,273 464,260" fill="#FFD700"/>
    <polygon points="256,477 252,464 239,464 249,455 245,442 256,450 267,442 263,455 273,464 260,464" fill="#FFD700"/>
  </g>
  
  <!-- 立体白字 - 微软雅黑/黑体 -->
  <text x="256" y="355" 
        font-family="Microsoft YaHei, SimHei, Heiti SC, sans-serif" 
        font-size="400" 
        font-weight="bold" 
        fill="rgba(255,255,255,0.98)" 
        text-anchor="middle" 
        filter="url(#text3D)">白</text>
  
  <!-- 文字外描边 -->
  <text x="256" y="355" 
        font-family="Microsoft YaHei, SimHei, Heiti SC, sans-serif" 
        font-size="400" 
        font-weight="bold" 
        fill="none" 
        stroke="rgba(255,255,255,0.4)" 
        stroke-width="2"
        text-anchor="middle">白</text>
</svg>
