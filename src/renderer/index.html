<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <!-- CMP-17：内容安全策略（纵深防御，XSS 后效阻断内联脚本执行）。
         - script-src 'unsafe-eval'：Monaco/Vite 开发链路需要；2026-11-18 复核：
           渲染层源码无 new Function/eval 使用，移除该指令需实机验证 Monaco 兼容性；
         - style-src 'unsafe-inline'：Vue/Monaco/KaTeX 内联样式需要；
         - img-src data: https: file:：Markdown 远程图片、base64 内嵌图与本地
           相对路径图片（预览层将相对路径转换为 file:// 绝对 URL，FE-12）；
         - frame-src 'self' file:：PDF 预览（Electron 内置查看器/iframe 本地文件）；
         - connect-src localhost:：保留 Vite dev HMR（http/ws）；
         - object-src 'none' / base-uri 'self' / form-action 'none'：
           2026-11-18（遗留清单 #6）补充的无功能影响收紧——禁止插件对象、限制
           <base> 注入（防相对路径劫持）、禁止表单提交外发。 -->
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: file:; font-src 'self' data:; frame-src 'self' file:; connect-src 'self' http://localhost:* ws://localhost:*; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
        />
        <link rel="stylesheet" href="./src/styles/preview_font/atom-one-light.css" />
        <link rel="stylesheet" href="./src/styles/material/admonition.css" />
        <link rel="stylesheet" href="./src/styles/material/gridcards.css" />
        <link rel="stylesheet" href="./src/styles/sheet_dialog/normalize.css" />
    </head>

    <body style="overflow: hidden">
        <div id="app"></div>
        <script type="module" src="./src/main.ts"></script>
    </body>
</html>
