<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1120"/>
      <stop offset="100%" style="stop-color:#111B33"/>
    </linearGradient>
    <linearGradient id="accentDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E0FF"/>
      <stop offset="100%" style="stop-color:#6C5CE7"/>
    </linearGradient>
    <filter id="glowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadowDark" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bgDark)" filter="url(#softShadowDark)"/>
  
  <!-- 透镜符号（超放大：顶点从 y=100/412 扩展至 y=80/432） -->
  <path d="M256 80 L416 256 L256 432 L96 256 Z" fill="none" stroke="url(#accentDark)" stroke-width="16" stroke-linejoin="round" filter="url(#glowDark)"/>
  
  <!-- 中心圆点再次放大 -->
  <circle cx="256" cy="256" r="36" fill="#00E0FF" filter="url(#glowDark)"/>
  <circle cx="256" cy="256" r="16" fill="#FFFFFF"/>
  
  <!-- 数据弧放大加粗 -->
  <ellipse cx="256" cy="256" rx="210" ry="70" fill="none" stroke="#6C5CE7" stroke-width="5" stroke-dasharray="14 18" opacity="0.6" transform="rotate(45 256 256)"/>
  
  <!-- 品牌文字进一步下移并缩小 -->
  <text x="256" y="480" font-family="'Inter','Segoe UI',sans-serif" font-size="28" font-weight="700" fill="#E2E8F0" text-anchor="middle" letter-spacing="8">白泽笔记</text>
  <text x="256" y="506" font-family="monospace" font-size="10" font-weight="500" fill="#00E0FF" text-anchor="middle" letter-spacing="5">BAIZE NOTES</text>
</svg>