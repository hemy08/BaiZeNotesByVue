<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1120"/>
      <stop offset="100%" style="stop-color:#111B33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E0FF"/>
      <stop offset="100%" style="stop-color:#6C5CE7"/>
    </linearGradient>
    <linearGradient id="orbit_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E0FF"/>
      <stop offset="50%" style="stop-color:#FF6B9D"/>
      <stop offset="100%" style="stop-color:#6C5CE7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- 抽象透镜（科技洞察）- 放大30%并上移 -->
  <path d="M256 69.6 L422.4 236 L256 402.4 L89.6 236 Z" fill="none" stroke="url(#accent)" stroke-width="15.6" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- 内核数据点 - 放大30%并上移 -->
  <circle cx="256" cy="236" r="20.8" fill="#00E0FF" filter="url(#glow)"/>
  <circle cx="256" cy="236" r="7.8" fill="#FFFFFF"/>
  <!-- 数据轨迹环 - 放大30%并上移 - 使用渐变色和更强的发光效果 -->
  <ellipse cx="256" cy="236" rx="182" ry="65" fill="none" stroke="url(#orbit_gradient)" stroke-width="5.2" stroke-dasharray="10.4 15.6" opacity="0.9" transform="rotate(45 256 236)" filter="url(#glow)"/>
  <!-- 品牌字 -->
  <text x="256" y="460" font-family="'Inter','Segoe UI',sans-serif" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="10">白泽笔记</text>
  <text x="256" y="492" font-family="'Inter','Segoe UI',sans-serif" font-size="14" font-weight="300" fill="#00E0FF" text-anchor="middle" letter-spacing="6">BAIZE NOTES</text>
</svg>
