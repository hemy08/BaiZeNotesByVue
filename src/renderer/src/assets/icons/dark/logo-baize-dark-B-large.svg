<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgDark2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020617"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>
    <radialGradient id="coreDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00E0FF;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#6C5CE7;stop-opacity:0"/>
    </radialGradient>
    <filter id="glowDarkCore" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dropShadowDark" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bgDark2)" filter="url(#dropShadowDark)"/>
  
  <!-- 外弧放大 -->
  <path d="M160 160 A 200 200 0 0 1 352 160" fill="none" stroke="#00E0FF" stroke-width="10" stroke-linecap="round" filter="url(#glowDarkCore)"/>
  <!-- 中弧放大 -->
  <path d="M88 280 A 240 240 0 0 0 424 280" fill="none" stroke="#6C5CE7" stroke-width="10" stroke-linecap="round" filter="url(#glowDarkCore)"/>
  <!-- 内弧放大 -->
  <path d="M184 384 A 160 160 0 0 0 328 384" fill="none" stroke="#00E0FF" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  
  <!-- 中心高亮核放大 -->
  <circle cx="256" cy="256" r="140" fill="url(#coreDark)"/>
  <circle cx="256" cy="256" r="32" fill="#00E0FF" filter="url(#glowDarkCore)"/>
  <circle cx="256" cy="256" r="14" fill="#FFFFFF"/>
  
  <!-- 品牌文字下移 -->
  <text x="256" y="470" font-family="'Inter','Segoe UI',sans-serif" font-size="34" font-weight="700" fill="#E2E8F0" text-anchor="middle" letter-spacing="8">白泽笔记</text>
  <text x="256" y="502" font-family="monospace" font-size="12" font-weight="500" fill="#6C5CE7" text-anchor="middle" letter-spacing="6">BAIZE NOTES</text>
</svg>