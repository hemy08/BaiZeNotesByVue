<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgLight2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F0F4FA"/>
    </linearGradient>
    <radialGradient id="coreLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1E88E5;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#8E24AA;stop-opacity:0"/>
    </radialGradient>
    <filter id="glowLight">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#90A4AE" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bgLight2)" filter="url(#dropShadow)"/>
  <!-- 三条数据弧 -->
  <path d="M180 180 A 160 160 0 0 1 332 180" fill="none" stroke="#1E88E5" stroke-width="8" stroke-linecap="round" filter="url(#glowLight)"/>
  <path d="M120 280 A 200 200 0 0 0 392 280" fill="none" stroke="#8E24AA" stroke-width="8" stroke-linecap="round" filter="url(#glowLight)"/>
  <path d="M200 380 A 140 140 0 0 0 312 380" fill="none" stroke="#1E88E5" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <!-- 中心能量核 -->
  <circle cx="256" cy="256" r="110" fill="url(#coreLight)"/>
  <circle cx="256" cy="256" r="24" fill="#1E88E5" filter="url(#glowLight)"/>
  <circle cx="256" cy="256" r="10" fill="#FFFFFF"/>
  <!-- 品牌文字 -->
  <text x="256" y="460" font-family="'Inter','Segoe UI',sans-serif" font-size="38" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="8">白泽笔记</text>
  <text x="256" y="496" font-family="monospace" font-size="14" font-weight="500" fill="#8E24AA" text-anchor="middle" letter-spacing="6">BAIZE NOTES</text>
</svg>