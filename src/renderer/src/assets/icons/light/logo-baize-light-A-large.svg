<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFF"/>
      <stop offset="100%" style="stop-color:#E8EEF9"/>
    </linearGradient>
    <linearGradient id="accentLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E88E5"/>
      <stop offset="100%" style="stop-color:#8E24AA"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#B0BEC5" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bgLight)" filter="url(#softShadow)"/>
  
  <!-- 透镜符号（放大：外框从 256-128 扩展为 256-100） -->
  <path d="M256 100 L396 256 L256 412 L116 256 Z" fill="none" stroke="url(#accentLight)" stroke-width="14" stroke-linejoin="round"/>
  
  <!-- 中心圆点放大 -->
  <circle cx="256" cy="256" r="28" fill="#1E88E5"/>
  <circle cx="256" cy="256" r="12" fill="#FFFFFF"/>
  
  <!-- 数据弧放大且加粗 -->
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="#8E24AA" stroke-width="4" stroke-dasharray="12 16" opacity="0.5" transform="rotate(45 256 256)"/>
  
  <!-- 品牌文字下移并适当缩小，以突出图形 -->
  <text x="256" y="470" font-family="'Inter','Segoe UI',sans-serif" font-size="34" font-weight="700" fill="#1E293B" text-anchor="middle" letter-spacing="8">白泽笔记</text>
  <text x="256" y="502" font-family="monospace" font-size="12" font-weight="500" fill="#1E88E5" text-anchor="middle" letter-spacing="6">BAIZE NOTES</text>
</svg>